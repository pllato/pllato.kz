name: Deploy CRM Worker (pllato-comm)

# Деплой Cloudflare Worker «pllato-comm» — это API портала: CRM, задачи,
# календарь и реестр договоров с ЭЦП (crm/worker/worker.js).
#  • вручную — вкладка Actions → «Deploy CRM Worker (pllato-comm)» → Run workflow
#  • автоматически — при пуше в main, если менялись файлы crm/worker/**
#
# Нужен тот же секрет репозитория, что и у деплоя elc-worker:
# CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions).
# У токена должны быть права Workers Scripts:Edit, D1:Edit и R2:Edit —
# воркер использует и базу, и бакет с файлами договоров.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'crm/worker/**'
      - '.github/workflows/deploy-crm-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # В crm/worker нет package.json — воркер без зависимостей,
      # поэтому ставим wrangler разово через npx. Версия — та же major,
      # что и в elc-worker, чтобы поведение деплоя совпадало.
      - name: Deploy to Cloudflare
        working-directory: crm/worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
