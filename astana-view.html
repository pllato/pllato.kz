<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ELC Astana · Просмотр воронки</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:#20243b;font:15px/1.45 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button,input,select{border:1px solid #dce0e9;border-radius:8px;background:white;padding:9px 13px;color:inherit}button:hover{background:#f0f2f8}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9aace0;outline-offset:2px}header{background:white;border-bottom:1px solid #e2e5ed;padding:16px 28px;display:flex;align-items:center;gap:16px}h1{font-size:21px;margin:0}.muted{color:#727b8e;font-size:13px}.identity{margin-left:auto;display:flex;align-items:center;gap:12px}main{max-width:1500px;margin:auto;padding:24px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar input{flex:1;min-width:180px}#state{margin:10px 0 18px;color:#68718a}.table-wrap{overflow:auto;background:white;border:1px solid #e0e4ec;border-radius:12px}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:12px;color:#6d758a;background:#f9fafc;white-space:nowrap}td,th{padding:13px 16px;border-bottom:1px solid #edf0f4}tbody tr{cursor:pointer}tbody tr:hover{background:#f7f9fd}.name{font-weight:600;min-width:180px}.stage{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.dot{height:9px;width:9px;border-radius:50%;background:var(--stage,#9099ab);border:1px solid #0002;flex-shrink:0}footer{display:flex;gap:16px;align-items:center;justify-content:flex-end;padding:16px 0}.login{max-width:440px;background:white;border:1px solid #e0e4ec;border-radius:14px;padding:32px;margin:8vh auto;text-align:center}.primary{background:#353b80;color:white;border-color:#353b80}.primary:hover{background:#282e69}.error{color:#a13232!important}dialog{width:min(600px,calc(100% - 28px));max-height:85vh;border:0;border-radius:14px;padding:26px;box-shadow:0 20px 80px #20243b33}dialog::backdrop{background:#151c3d66}dialog h2{font-size:22px;margin:0 0 18px}.detail{display:grid;grid-template-columns:145px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid #edf0f4}.detail b{font-size:13px;color:#737b8f;font-weight:500}.detail span{white-space:pre-wrap;overflow-wrap:anywhere}.dialog-head{display:flex;justify-content:space-between;align-items:start;gap:15px}#viewer[hidden],#login[hidden]{display:none}@media(max-width:650px){header{padding:14px 16px;flex-wrap:wrap}.identity{width:100%;margin:0;justify-content:space-between}main{padding:16px}td,th{padding:12px}.toolbar select{width:100%}.detail{grid-template-columns:1fr;gap:4px}}
</style></head><body>
<header><div><h1>ELC Astana</h1><div class="muted">Просмотр воронки · без права изменений</div></div><div class="identity"><span id="email" class="muted"></span><button id="logout" hidden>Выйти</button></div></header>
<main><section id="login" class="login"><h2>Вход в воронку</h2><p class="muted">Войдите через Google с аккаунтом, которому предоставлен доступ.</p><button id="signin" class="primary">Войти через Google</button><p id="auth-error" class="error" role="alert"></p></section>
<section id="viewer" hidden><form class="toolbar" id="filters"><input id="search" type="search" placeholder="Поиск по имени или телефону" aria-label="Поиск по имени или телефону"><select id="stage" aria-label="Стадия"><option value="">Все стадии</option></select><button type="submit">Найти</button><button type="button" id="refresh">Обновить</button></form><div id="state" role="status" aria-live="polite"></div><div class="table-wrap"><table><thead><tr><th>Имя</th><th>Телефон</th><th>Стадия</th><th>Пробный урок</th><th>Ответственный</th><th>Источник</th></tr></thead><tbody id="rows"></tbody></table></div><footer><button id="prev">Назад</button><span id="page" class="muted"></span><button id="next">Далее</button></footer></section></main>
<dialog id="card"><div class="dialog-head"><h2 id="card-name"></h2><button id="close" aria-label="Закрыть карточку">Закрыть</button></div><div id="card-details"></div></dialog>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
const auth=getAuth(initializeApp({apiKey:'AIzaSyC3Cw3nX6b1zpE1-lqW1whwUsPPUQ7TIhc',authDomain:'pllato-crm.firebaseapp.com',projectId:'pllato-crm',appId:'1:690738857241:web:2356e97c435656890ab188'}));
const $=id=>document.getElementById(id);let offset=0,items=[],stages=[],total=0,sequence=0;let controller;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=x=>x&&!isNaN(Date.parse(x))?new Intl.DateTimeFormat('ru-RU',{timeZone:'Asia/Almaty',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(x)):'—';
const stageOf=id=>stages.find(s=>String(s.id)===String(id));
const stageColor=s=>/^#[\da-f]{3,8}$/i.test(s?.color||'')?s.color:'#9099ab';
function stageHtml(id){const s=stageOf(id);return `<span class="stage"><i class="dot" style="--stage:${stageColor(s)}"></i>${esc(s?.name||id||'—')}</span>`;}
async function load(){
 if(!auth.currentUser)return;const n=++sequence;controller?.abort();controller=new AbortController();$('state').classList.remove('error');$('state').textContent='Загружаем заявки…';$('rows').replaceChildren();$('prev').disabled=true;$('next').disabled=true;
 try{
 const params=new URLSearchParams({offset:String(offset),q:$('search').value.trim(),stage:$('stage').value});
 const token=await auth.currentUser.getIdToken();const r=await fetch('https://pllato-elc-worker.uurraa.workers.dev/api/astana-view?'+params,{headers:{Authorization:'Bearer '+token},signal:controller.signal,cache:'no-store'});const data=await r.json();if(n!==sequence)return;if(!r.ok)throw Error(data.error||'Не удалось загрузить воронку');
 $('viewer').hidden=false;$('login').hidden=true;items=data.items;total=data.total;stages=Array.isArray(data.pipeline.stages)?data.pipeline.stages:Object.entries(data.pipeline.stages||{}).map(([id,s])=>({id,...s}));
 const selected=$('stage').value;$('stage').innerHTML='<option value="">Все стадии</option>'+stages.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');$('stage').value=selected;
 $('rows').innerHTML=items.map((d,i)=>`<tr tabindex="0" data-row="${i}" aria-label="Открыть карточку ${esc(d.name)}"><td class="name">${esc(d.name)}</td><td>${esc(d.phone||'—')}</td><td>${stageHtml(d.stageId)}</td><td>${date(d.trialLessonAt)}</td><td>${esc(d.responsible||'—')}</td><td>${esc(d.source||'—')}</td></tr>`).join('');
 $('state').textContent=total?`Показано ${offset+1}–${offset+items.length} из ${total}. Нажмите на строку, чтобы просмотреть карточку.`:'Заявки не найдены.';$('page').textContent=`Страница ${Math.floor(offset/100)+1}`;$('prev').disabled=offset===0;$('next').disabled=offset+items.length>=total;
 }catch(e){if(e.name==='AbortError'||n!==sequence)return;$('state').classList.add('error');$('state').textContent=e.message;$('auth-error').textContent=e.message;}
}
function openCard(i){const d=items[i];if(!d)return;$('card-name').textContent=d.name;const fields=[['Телефон',esc(d.phone||'—')],['Стадия',stageHtml(d.stageId)],['Дата пробного',date(d.trialLessonAt)],['Ответственный',esc(d.responsible||'—')],['Источник',esc(d.source||'—')],['Текущий уровень',esc(d.level||'—')],['Примечание',esc(d.note||'—')]];$('card-details').innerHTML=fields.map(([k,v])=>`<div class="detail"><b>${k}</b><span>${v}</span></div>`).join('');$('card').showModal();}
$('rows').onclick=e=>{const row=e.target.closest('[data-row]');if(row)openCard(Number(row.dataset.row));};$('rows').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const row=e.target.closest('[data-row]');if(row){e.preventDefault();openCard(Number(row.dataset.row));}}};$('close').onclick=()=>$('card').close();
$('signin').onclick=async()=>{try{$('auth-error').textContent='';const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});await signInWithPopup(auth,p);}catch(e){$('auth-error').textContent='Не удалось войти через Google. '+(e.code||'');}};
$('logout').onclick=()=>signOut(auth);$('filters').onsubmit=e=>{e.preventDefault();offset=0;load();};$('stage').onchange=()=>{offset=0;load();};$('refresh').onclick=()=>load();$('prev').onclick=()=>{offset=Math.max(0,offset-100);load();};$('next').onclick=()=>{offset+=100;load();};
onAuthStateChanged(auth,user=>{++sequence;controller?.abort();items=[];stages=[];$('rows').replaceChildren();$('card').close();$('card-details').replaceChildren();$('card-name').textContent='';$('email').textContent=user?.email||'';$('logout').hidden=!user;$('viewer').hidden=true;$('login').hidden=false;if(user){offset=0;load();}});
</script></body></html>
