function analytics(){return head('Аналитика руководителя','От источника заявки до прибыли и повторных продаж',`<button class="btn">Период: сентябрь</button><button class="btn blue">Экспорт PDF</button>`)+`<div class="grid g4">${metric('Выручка','128,4 млн ₸','план 115 млн','var(--green)')}${metric('Валовая прибыль','25,8 млн ₸','маржа 20,1%','var(--blue)')}${metric('Новые клиенты','23','7 повторных','var(--violet)')}${metric('Потери прибыли','1,84 млн ₸','скидки, брак, доставка','var(--red)','bad')}</div><div class="grid g2" style="margin-top:14px"><div class="card cardpad">${section('Выручка и валовая прибыль','6 месяцев')}<div class="trend" style="height:210px">${[45,61,58,73,82,96].map((h,i)=>`<div style="height:${h}%"><small>${['Апр','Май','Июн','Июл','Авг','Сен'][i]}</small></div>`).join('')}</div></div><div class="card cardpad">${section('Откуда теряется прибыль','1,84 млн ₸')}<div class="attention"><i class="signal"></i><div style="width:100%"><b>Скидки без согласования · 780 тыс. ₸</b><div class="bar" style="margin-top:6px"><i style="width:42%;background:var(--red)"></i></div></div></div><div class="attention"><i class="signal amber"></i><div style="width:100%"><b>Доставка за счёт компании · 520 тыс. ₸</b><div class="bar" style="margin-top:6px"><i style="width:28%;background:var(--orange)"></i></div></div></div><div class="attention"><i class="signal blue"></i><div style="width:100%"><b>Недостача и списание · 310 тыс. ₸</b><div class="bar" style="margin-top:6px"><i style="width:17%"></i></div></div></div></div></div><div class="card cardpad" style="margin-top:14px">${section('Категории','выручка · маржа · оборачиваемость')}<div class="tablewrap"><table class="tbl"><thead><tr><th>Категория</th><th>Выручка</th><th>Валовая прибыль</th><th>Маржа</th><th>Оборот запасов</th><th>Сигнал</th></tr></thead><tbody>${[['Кабель','52,8 млн','9,2 млн','17,4%','28 дней','Дефицит 2 SKU'],['Автоматика','39,6 млн','10,7 млн','27,0%','41 день','Норма'],['Лотки и крепёж','21,4 млн','3,9 млн','18,2%','35 дней','Норма'],['Светотехника','14,6 млн','2,0 млн','13,7%','67 дней','Медленно']].map((r,i)=>`<tr><td><b>${r[0]}</b></td>${r.slice(1,5).map(x=>`<td>${x}</td>`).join('')}<td><span class="status ${i===0?'red':i===3?'amber':'green'}">${r[5]}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function sync(){return head('Обмен с 1С 8.3','Бухгалтер продолжает работать в 1С; менеджеры — в удобном портале',`<button class="btn" data-action="syncNow">↻ Синхронизировать сейчас</button>`)+`<div class="card cardpad">${section('Контур обмена','1С:Бухгалтерия для Казахстана 3.0')}<div class="flow"><span class="node">WhatsApp / Телефон / Instagram</span><span class="arrow">→</span><span class="node" style="border-color:#8fb7e9;background:#edf5ff">VOLT CONTROL</span><span class="arrow">⇄</span><span class="node" style="border-color:#efbd7b;background:#fff5e8">1С 8.3</span><span class="arrow">→</span><span class="node">Бухгалтерия</span></div></div><div class="grid g2" style="margin-top:14px"><div class="card cardpad">${section('Из 1С в портал','каждые 15 минут')}<div class="syncrow"><b>Номенклатура</b><div class="bar"><i style="width:100%"></i></div><span class="status green">1 438 · готово</span></div><div class="syncrow"><b>Остатки и цены</b><div class="bar"><i style="width:100%"></i></div><span class="status green">10:45</span></div><div class="syncrow"><b>Оплаты</b><div class="bar"><i style="width:100%"></i></div><span class="status green">10:42</span></div><div class="syncrow"><b>Контрагенты</b><div class="bar"><i style="width:96%"></i></div><span class="status amber">2 дубля</span></div></div><div class="card cardpad">${section('Из портала в 1С','по подтверждённому действию')}<div class="syncrow"><b>Счета</b><div class="bar"><i style="width:100%"></i></div><span class="status green">42</span></div><div class="syncrow"><b>Реализации</b><div class="bar"><i style="width:100%"></i></div><span class="status green">31</span></div><div class="syncrow"><b>Возвраты</b><div class="bar"><i style="width:100%"></i></div><span class="status green">3</span></div><div class="syncrow"><b>Заказы поставщику</b><div class="bar"><i style="width:78%"></i></div><span class="status amber">проверка</span></div></div></div><div class="card cardpad" style="margin-top:14px">${section('Журнал синхронизации','последние операции')}<div class="attention"><i class="signal blue"></i><div><b>Оплата INV-1847 сопоставлена</b><small>6 320 000 ₸ · Central Beton · без расхождений</small></div><time>10:42</time></div><div class="attention"><i class="signal blue"></i><div><b>Остатки обновлены</b><small>1 438 позиций · изменилось 87</small></div><time>10:30</time></div><div class="attention"><i class="signal amber"></i><div><b>Найдены возможные дубли контрагента</b><small>ТОО PromStroy / ПромСтрой KZ · требуется решение</small></div><time>10:16</time></div></div>`}
function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>action(x.dataset.action));document.querySelectorAll('[data-deal]').forEach(x=>{x.onclick=()=>openDeal(x.dataset.deal);x.ondragstart=e=>e.dataTransfer.setData('text/plain',x.dataset.deal)});document.querySelectorAll('.kan-col').forEach(c=>{c.ondragover=e=>e.preventDefault();c.ondrop=e=>{e.preventDefault();const d=deals.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(d){d.stage=c.dataset.stage;render();toast('Сделка перемещена · клиенту можно отправить автоуведомление')}}});document.querySelectorAll('[data-product]').forEach(x=>x.onclick=()=>openProduct(+x.dataset.product));document.querySelectorAll('[data-client]').forEach(x=>x.onclick=()=>openClient(+x.dataset.client));document.querySelectorAll('[data-thread]').forEach(x=>x.onclick=()=>toast('Открыта переписка · вся история остаётся в карточке клиента'));document.querySelectorAll('[data-shipping]').forEach(x=>x.onclick=()=>openShipping(+x.dataset.shipping));document.querySelectorAll('[data-invoice]').forEach(x=>x.onclick=()=>toast('Открыт счёт '+x.dataset.invoice));}
function action(a){if(a==='new')newDeal();else if(a==='createFromChat'){deals.unshift({id:'D-1049',name:'ТОО «KazTech Plant»',req:'24 позиции из Excel + кабель 1500 м',amount:0,stage:'new',manager:'Абу-Хаир',source:'WhatsApp',age:'сейчас',hot:1});toast('Создана отдельная заявка D-1049 · история WhatsApp прикреплена');setTimeout(()=>go('sales'),800)}else if(a==='send')toast('Сообщение отправлено и сохранено в истории');else if(a==='syncNow')toast('Синхронизация запущена · обновлено 87 позиций');else if(a==='scan')toast('Сканер готов · наведите на штрихкод товара');else toast('Действие доступно в рабочей версии')}
function newDeal(){modal('Новая заявка','Создайте вручную или получите автоматически из канала',`<div class="grid g2"><label>Компания<input class="search" style="width:100%;margin-top:6px" value="ТОО «Новый клиент»"></label><label>Источник<select class="filter" style="width:100%;margin-top:6px"><option>WhatsApp</option><option>Телефон</option><option>Instagram</option></select></label><label class="span2">Что нужно<input class="search" style="width:100%;margin-top:6px" placeholder="Список оборудования или описание"></label></div><div style="text-align:right;margin-top:16px"><button class="btn blue" onclick="closeModal();toast('Заявка создана и назначена менеджеру')">Создать заявку</button></div>`)}
function openDeal(id){const d=deals.find(x=>x.id===id);if(!d)return;state.deal=d;const tabs=[['overview','Обзор'],['messages','WhatsApp и звонки'],['items','Позиции'],['docs','Документы'],['history','История']];modal(`${d.id} · ${d.name}`,`${d.req} · ${rub(d.amount)} · ${d.manager}`,`<div class="tabs">${tabs.map(t=>`<button class="tab ${state.tab===t[0]?'active':''}" data-modal-tab="${t[0]}">${t[1]}</button>`).join('')}</div><div id="dealTab">${dealTab(d,state.tab)}</div>`);document.querySelectorAll('[data-modal-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.modalTab;document.querySelectorAll('[data-modal-tab]').forEach(x=>x.classList.toggle('active',x===b));dealTabEl.innerHTML=dealTab(d,state.tab)});const dealTabEl=document.getElementById('dealTab')}
function dealTab(d,t){if(t==='messages')return `<div class="grid g2"><div class="card cardpad"><b>WhatsApp</b><p style="font-size:10px;color:var(--muted)">Клиент прислал Excel на 24 позиции и уточнение по кабелю. Менеджер подтвердил срок расчёта.</p><button class="btn green">Открыть диалог</button></div><div class="card cardpad"><b>Звонки</b><p style="font-size:10px;color:var(--muted)">2 разговора · 08:34 · запись хранится в карточке.</p><button class="btn">▶ Прослушать</button></div></div>`;if(t==='items')return `<table class="tbl"><thead><tr><th>Позиция</th><th>Количество</th><th>Остаток</th><th>Цена</th><th>Маржа</th></tr></thead><tbody><tr><td><b>Кабель ВВГнг-LS 3×2,5</b></td><td>1 500 м</td><td>4 820 м</td><td>1 180 ₸</td><td>18%</td></tr><tr><td><b>ABB S203 C32</b></td><td>120 шт.</td><td>184 шт.</td><td>18 400 ₸</td><td>24%</td></tr><tr><td><b>Schneider LC1D25</b></td><td>35 шт.</td><td><span class="status red">21 · дефицит</span></td><td>42 700 ₸</td><td>27%</td></tr></tbody></table>`;if(t==='docs')return `<div class="grid g3"><div class="card cardpad"><b>Коммерческое предложение</b><p style="font-size:9px;color:var(--muted)">KP-1048.pdf · версия 2</p><span class="status green">Отправлено</span></div><div class="card cardpad"><b>Счёт на оплату</b><p style="font-size:9px;color:var(--muted)">Создать из согласованных позиций</p><button class="btn blue">Создать в 1С</button></div><div class="card cardpad"><b>Доверенность</b><p style="font-size:9px;color:var(--muted)">Появится перед отгрузкой</p><span class="status gray">Ожидается</span></div></div>`;if(t==='history')return `<div class="timeline"><div class="event"><b>КП отправлено клиенту</b><p>Сегодня, 10:26 · Абу-Хаир</p></div><div class="event"><b>Расчёт согласован руководителем</b><p>Сегодня, 10:18 · маржа 21,4%</p></div><div class="event"><b>Excel распознан и добавлен в позиции</b><p>Сегодня, 10:02 · 24 строки</p></div><div class="event"><b>Заявка создана из WhatsApp</b><p>Сегодня, 09:58 · постоянный клиент</p></div></div>`;return `<div class="grid g3"><div class="card cardpad"><small style="color:var(--muted)">Текущий этап</small><h3>${stages.find(s=>s[0]===d.stage)?.[1]}</h3><span class="status amber">следующий шаг сегодня</span></div><div class="card cardpad"><small style="color:var(--muted)">Сумма</small><h3>${rub(d.amount)}</h3><span class="status green">маржа 21,4%</span></div><div class="card cardpad"><small style="color:var(--muted)">Ответственный</small><h3>${d.manager}</h3><span class="status">первый ответ 6 мин</span></div></div><div class="card cardpad" style="margin-top:12px"><b>Следующий шаг</b><p style="font-size:10px;color:var(--muted)">Уточнить срок поставки Schneider LC1D25, согласовать аналог и выставить счёт до 15:00.</p><button class="btn blue">✓ Выполнить</button> <button class="btn">Создать задачу</button></div>`}
function openProduct(i){const p=products[i];modal(p[1],`${p[0]} · место ${p[6]}`,`<div class="grid g4">${metric('Фактический остаток',p[4]+' '+p[3],'из 1С','var(--blue)')}${metric('В резерве','700 '+p[3],'под 2 сделки','var(--violet)')}${metric('Минимум',p[5]+' '+p[3],p[8]==='low'?'требуется закуп':'норма',p[8]==='low'?'var(--red)':'var(--green)',p[8]==='low'?'bad':'')}${metric('Цена продажи',p[7],'маржа 22%','var(--orange)')}</div><div class="card cardpad" style="margin-top:14px">${section('Движение товара','последние операции')}<div class="timeline"><div class="event"><b>Резерв под D-1048</b><p>Сегодня, 10:18 · 700 ${p[3]}</p></div><div class="event"><b>Поступление от поставщика</b><p>28 сентября · партия PO-216</p></div><div class="event"><b>Инвентаризация</b><p>26 сентября · расхождений нет</p></div></div></div>`)}
function openClient(i){const names=['KazTech Plant','PromStroy KZ','Alatau Machinery','BI Engineering'];modal('ТОО «'+names[i]+'»','Карточка клиента · реквизиты, контакты, заявки и документы',`<div class="grid g3">${metric('Оборот 12 мес.',i===1?'214,8 млн ₸':'86,4 млн ₸','по данным 1С','var(--green)')}${metric('Заявки','7','5 завершено','var(--blue)')}${metric('Дебиторка',i===1?'71,5 млн ₸':'0 ₸',i===1?'просрочено 2 дня':'нет долга',i===1?'var(--red)':'var(--green)',i===1?'bad':'')}</div><div class="card cardpad" style="margin-top:14px"><b>История отношений</b><p style="font-size:10px;color:var(--muted)">Все обращения разделены на отдельные заявки, но собраны в единой карточке компании. Руководитель видит переписку, звонки, КП, счета, оплаты и отгрузки.</p><button class="btn blue">Открыть 7 заявок</button></div>`)}
function openShipping(i){modal('Контроль отгрузки '+['SH-882','SH-881','SH-880'][i],'Сканирование исключает выдачу другого товара',`<div class="grid g2"><div class="card cardpad"><b>1. Основание</b><p style="font-size:10px;color:var(--muted)">Счёт оплачен · доверенность загружена · менеджер подтвердил.</p><span class="status green">Проверено</span></div><div class="card cardpad"><b>2. Комплектация</b><p style="font-size:10px;color:var(--muted)">Кладовщик сканирует ячейку и каждую позицию.</p><span class="status amber">В работе</span></div></div><div class="card cardpad" style="margin-top:12px"><b>Позиции</b><div class="attention"><i class="signal blue"></i><div><b>ABB S203 C32 · 60 шт.</b><small>Ячейка B-02-04 · собрано 60/60</small></div><span class="status green">✓</span></div><div class="attention"><i class="signal"></i><div><b>УЗО 2P 40A · 26 шт.</b><small>Скан другого артикула заблокирован</small></div><span class="status red">проверить</span></div></div>`)}
function modal(title,sub,body){document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="overlay"><div class="modal"><div class="modalhead"><div><h2>${title}</h2><p>${sub}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="modalbody">${body}</div></div></div>`);const overlay=document.getElementById('overlay');overlay.onclick=e=>{if(e.target===overlay)closeModal()}}
function closeModal(){document.getElementById('overlay')?.remove();state.tab='overview'}
const guideSteps=[['Пульт руководителя','Начните здесь: красные сигналы показывают, где теряются деньги, клиент или товар.'],['Продажи','Каждое обращение становится отдельной заявкой. Карточки можно перетаскивать между этапами.'],['Входящие','WhatsApp, звонки, Instagram и сайт собраны в одном окне. Из сообщения создаётся новая заявка.'],['Склад и 1С','Остатки, резерв и оплаты приходят из 1С; менеджеру не нужно заходить в бухгалтерскую систему.']];let gi=0;
function showGuide(){guide.classList.add('show');guideTitle.textContent=guideSteps[gi][0];guideText.textContent=guideSteps[gi][1];guideDots.textContent=`${gi+1} из ${guideSteps.length}`}
guideNext.onclick=()=>{gi=(gi+1)%guideSteps.length;showGuide()};guideClose.onclick=()=>guide.classList.remove('show');help.onclick=()=>{gi=0;showGuide()};menu.onclick=()=>side.classList.toggle('open');role.onchange=e=>{state.role=e.target.value;toast('Роль переключена · права и стартовый экран адаптированы');if(state.role==='sales')go('sales');if(state.role==='stock')go('shipping')};globalSearch.onkeydown=e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(q){go(q.toLowerCase().includes('кабел')?'stock':'sales');toast('Найдено по запросу: '+q)}}};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();globalSearch.focus()}if(e.key==='Escape')closeModal()});
renderNav();render();setTimeout(()=>{if(!sessionStorage.getItem('volt-guide')){showGuide();sessionStorage.setItem('volt-guide','1')}},700);
</script>
