<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>КабельКонтроль AI · Pllato</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #111213; }
    body { overflow: hidden; }
    iframe { width: 100%; height: 100%; border: 0; background: #111213; }
    .loading {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: #111213;
      color: #f1f2f4;
      transition: opacity .2s ease, visibility .2s ease;
    }
    .loading[hidden] { display: none; }
    .loading-card { padding: 24px; text-align: center; }
    .loading-mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #69baf0;
      color: #10202b;
      font-size: 13px;
      font-weight: 800;
    }
    .loading-title { margin: 0; font-size: 22px; }
    .loading-text { margin: 10px 0 0; color: #9ba0a7; }
  </style>
</head>
<body>
  <div class="loading" id="loading" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-mark">КК</div>
      <h1 class="loading-title">КабельКонтроль AI</h1>
      <p class="loading-text">Открываю программу…</p>
    </div>
  </div>
  <iframe
    id="lineika-app"
    src="https://cable-control-ai.uniqb.chatgpt.site/"
    title="КабельКонтроль AI"
    allow="clipboard-read; clipboard-write"
  ></iframe>
  <script>
    document.getElementById('lineika-app').addEventListener('load', () => {
      document.getElementById('loading').hidden = true;
    });
  </script>
</body>
</html>
