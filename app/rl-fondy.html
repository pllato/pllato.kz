<!DOCTYPE html>
<html lang="ru">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RL · Фонды проектов</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --ink:#1a2230;--paper:#eef0f3;--line:#d5d9e0;--muted:#5d6472;--card:#fff;
    --green:#0f6f52;--green-bg:#e4f0eb;--red:#b23b3b;--red-bg:#f6e6e6;
    --blue:#345b8f;--blue-bg:#e7edf5;--amber:#8a6f4a;--amber-bg:#f0ebe3;--navy:#1a2536;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
  .top{background:var(--navy);color:#fff;padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .top b{font-size:16px;letter-spacing:-.3px}.top span.v{font-size:11px;color:#7d8aa3}
  .top .sp{flex:1}
  .tbtn{background:rgba(255,255,255,.1);border:none;color:#dfe6f0;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:inherit}
  .tbtn:hover{background:rgba(255,255,255,.2)}
  .tbtn.acc{background:#3f6ea8}.tbtn.acc:hover{background:#4c7fbd}
  .wrap{max-width:1060px;margin:0 auto;padding:22px 18px 80px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:26px 0 10px;font-weight:700}
  .explain{font-size:12.5px;color:#41495a;background:#eef1f5;border:1px solid var(--line);border-left:3px solid var(--blue);padding:10px 14px;border-radius:8px;margin-bottom:12px;line-height:1.55}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin-bottom:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
  .kpi .v{font-size:18px;font-weight:700;margin-top:4px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .kpi .d{font-size:10.5px;color:var(--muted);margin-top:2px}
  .pos{color:var(--green)}.neg{color:var(--red)}
  input,select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fbfaf7;color:var(--ink);font-family:inherit;width:100%}
  input:focus,select:focus{outline:none;border-color:var(--blue);background:#fff}
  label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:9px;font-size:13.5px;font-weight:700;padding:10px 18px;cursor:pointer;font-family:inherit}
  .btn:hover{background:#2b4d7a}
  .btn.grn{background:var(--green)}.btn.grn:hover{background:#0c5940}
  .btn.red{background:var(--red)}.btn.red:hover{background:#943030}
  .btn.ghost{background:none;border:1px dashed var(--line);color:var(--blue);font-weight:600}
  .btn.ghost:hover{background:var(--blue-bg);border-color:var(--blue)}
  .del{color:var(--muted);cursor:pointer;font-size:16px;padding:2px 8px;border-radius:6px;flex-shrink:0}
  .del:hover{background:var(--red-bg);color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:right;padding:8px 9px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
  th:first-child{text-align:left}
  td{padding:8px 9px;border-bottom:1px solid #eef0f3;text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
  td:first-child{text-align:left}tr:last-child td{border-bottom:none}
  .plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;cursor:pointer;transition:box-shadow .15s}
  .pcard:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);border-color:var(--blue)}
  .pcard .nm{font-weight:700;font-size:15px}.pcard .cu{font-size:11.5px;color:var(--muted);margin-bottom:8px}
  .pcard .row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
  .pcard .row span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
  .gap-warn{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--red-bg);color:var(--red);margin-top:8px}
  .gap-ok{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--green-bg);color:var(--green);margin-top:8px}
  .fin-badge{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:5px 9px;border-radius:7px;background:var(--amber-bg);color:var(--amber);margin-top:8px;border:1px solid #e3d3ba}
  .kb-card.has-fin{border-left:4px solid var(--amber);box-shadow:0 1px 0 rgba(138,111,74,.12)}
  .fund-head,.fund-row{display:grid;grid-template-columns:14px minmax(135px,1fr) 150px 150px 92px 92px minmax(130px,1fr) 58px 14px;gap:8px;align-items:center}
  .fund-head>* , .fund-row>*{min-width:0}
  .fund-head{padding:0 0 8px;border-bottom:1px solid var(--line);font-size:10px;line-height:1.25;font-weight:700;letter-spacing:.35px;text-transform:uppercase;color:var(--muted)}
  .fund-head .right{text-align:center}
  .fund-head small{display:block;margin-top:3px;font-size:8px;font-weight:600;letter-spacing:0;text-transform:none;color:#89909c}
  .fund-row{padding:8px 0;border-bottom:1px solid #eef0f3}
  .fund-row.fund-deficit{background:#fff2f1;border-radius:9px;padding-left:6px;padding-right:6px}
  .fbtns{display:flex;gap:5px}
  .fbtns span{font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;cursor:pointer;border:1px solid var(--line);color:var(--muted);background:#fbfaf7;white-space:nowrap}
  .fbtns span:first-child:hover{background:var(--green-bg);color:var(--green);border-color:var(--green)}
  .fbtns span:last-child:hover{background:var(--red-bg);color:var(--red);border-color:var(--red)}
  .nf-row{display:grid;grid-template-columns:1.5fr 80px 1fr auto;gap:8px;align-items:center;margin-bottom:7px}
  .plan-row.with-fund{grid-template-columns:125px 150px minmax(140px,0.9fr) minmax(170px,1.4fr) 152px auto auto}
  .fund-row:last-child{border-bottom:none}
  .fdot{width:11px;height:11px;border-radius:50%}
  .fplan,.ffactin{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center;padding:9px 8px;border-radius:8px;color:var(--green);font-size:12px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .fplan{background:var(--green-bg)}
  .ffactin{background:#edf4f1}
  .amount-pct{display:grid;grid-template-columns:34px 8px;align-items:center;justify-content:center;width:56px;box-sizing:border-box;white-space:nowrap;padding:4px 5px;border-radius:6px;font-size:11px;font-weight:800;line-height:1.2;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .fplan .amount-pct{background:var(--blue)}
  .ffactin .amount-pct{background:var(--green)}
  .amount-pct input,.amount-pct b{width:34px!important;padding:0!important;border:0;background:transparent;color:#fff;font-size:11px;font-weight:800;text-align:right}
  .amount-pct i{font-style:normal;text-align:left}
  .fplan>span,.ffactin>span{white-space:nowrap}
  .fexpense{padding:9px 8px;border-radius:8px;background:#f3f4f6;font-size:12px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .ffactout{padding:9px 8px;border-radius:8px;background:var(--red-bg);color:var(--red);font-size:12px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .fund-main{display:grid;grid-template-columns:1fr;align-items:center}
  .fmetrics{grid-column:7;display:grid;grid-template-columns:1fr;gap:5px}
  .fmetric{min-width:0;padding:7px 8px;border-radius:8px;background:#f7f8fa;text-align:right;font-variant-numeric:tabular-nums}
  .fmetric .flabel{font-size:8.5px;line-height:1.15;text-transform:uppercase;letter-spacing:.25px;color:var(--muted);white-space:normal}
  .fmetric .fvalue{margin-top:4px;font-size:12px;font-weight:700;line-height:1.15;white-space:nowrap}
  .fund-bars{display:grid;gap:7px;margin:5px 0 15px}
  .fund-bar-row{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center}
  .fund-bar-label{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .fund-bar{display:flex;height:11px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:#eef0f3}
  .forms{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  @media(max-width:760px){.forms{grid-template-columns:1fr}.fund-row{grid-template-columns:14px 1fr 68px 68px 68px 68px auto auto}.fund-head{display:none}.fund-main{grid-template-columns:1fr}.fmetrics{grid-column:2/7;grid-row:2;grid-template-columns:1fr;margin:0 0 6px}.fbtns{grid-column:7}.fund-row>.del{grid-column:8}}
  .fgrid{display:grid;grid-template-columns:120px 1fr;gap:8px;margin-bottom:8px}
  .fgrid3{display:grid;grid-template-columns:120px 1fr 1fr;gap:8px;margin-bottom:8px}
  .alloc{font-size:11.5px;color:var(--muted);background:var(--green-bg);border-radius:8px;padding:8px 11px;margin:8px 0;line-height:1.6;display:none}
  .warn{font-size:11.5px;color:#7a5c1e;background:var(--amber-bg);border-radius:8px;padding:8px 11px;margin:8px 0;display:none}
  .plan-row{display:grid;grid-template-columns:125px 150px minmax(180px,1fr) 152px auto auto;gap:8px;align-items:center;margin-bottom:7px;position:relative;padding:5px 7px;border-radius:9px}
  .plan-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--fill,0%);background:var(--fillc,rgba(15,111,82,.13));border-radius:9px;z-index:0;transition:width .35s ease}
  .plan-row>*{position:relative;z-index:1}
  textarea.note{width:100%;min-height:36px;resize:none;overflow:hidden;font-family:inherit;font-size:13.5px;line-height:1.35;
    padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fbfaf7;color:var(--ink);display:block}
  textarea.note:focus{outline:none;border-color:var(--blue);background:#fff}
  .plan-row{align-items:stretch}
  .plan-row>input,.plan-row>select{align-self:center}
  .pf-cell{align-self:center}.plan-row .mv,.plan-row .del{align-self:center}
  .pf-cell{display:grid;gap:3px;justify-items:stretch}
  .pf-bar{height:5px;border-radius:4px;background:#e4e7ec;overflow:hidden}
  .pf-bar i{display:block;height:100%;border-radius:4px;background:var(--barc,var(--green));transition:width .35s ease}
  .pf{font-size:9px;font-weight:700;border-radius:5px;padding:3px 5px;white-space:normal;text-align:center;line-height:1.2;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;min-height:20px}
  .pf.wait{background:#eceef2;color:var(--muted)}
  .pf.late{background:var(--red-bg);color:var(--red)}
  .pf.part{background:var(--amber-bg);color:var(--amber)}
  .pf.ok{background:var(--green-bg);color:var(--green)}
  .pf-panel{background:#eef1f5;border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin:2px 0 9px}
  .pf-panel .ttl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .pf-grid{display:grid;grid-template-columns:130px 150px 1fr auto;gap:8px;align-items:end}
  @media(max-width:760px){.pf-grid{grid-template-columns:1fr 1fr}}
  .mv{display:flex;gap:3px}
  .mv button{border:1px solid var(--line);background:#fff;border-radius:5px;font-size:9px;padding:3px 7px;cursor:pointer;color:var(--muted)}
  .mv button:hover{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
  .late{font-size:9.5px;font-weight:700;color:var(--red);background:var(--red-bg);border-radius:5px;padding:2px 6px;white-space:nowrap}
  .oprow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #eef0f3;font-size:12.5px}
  .oprow:last-child{border-bottom:none}
  .oprow .dt{color:var(--muted);width:80px;flex-shrink:0;font-variant-numeric:tabular-nums;font-size:11.5px}
  .oprow .ds{flex:1;min-width:0}.oprow .ds .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .oprow .ds .c{font-size:10.5px;color:var(--muted)}
  .oprow .am{font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}
  /* канбан этапов */
  .kb{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
  .kb-col{min-width:238px;width:238px;flex:none;background:#e9ebef;border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px}
  .kb-col.drop-hot{outline:2.5px solid var(--blue);background:var(--blue-bg)}
  .kb-head{display:flex;align-items:center;gap:5px;padding:2px 4px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .kb-head .cnt{background:#fff;border-radius:10px;padding:1px 7px;font-size:10.5px}
  .kb-head input{padding:5px 8px;font-size:12px;border-radius:6px;min-width:0}
  .kb-head-edit{display:block;padding-bottom:8px}
  .kb-head-edit input{display:block;width:100%;box-sizing:border-box;text-transform:none;letter-spacing:0;font-weight:600}
  .kb-head-edit .st-btns{display:flex;gap:5px;margin-top:5px}
  .kb-head-edit .st-btns .st-btn:last-child{margin-left:auto}
  .kb-head .st-btn{border:1px solid var(--line);background:#fff;border-radius:5px;font-size:10px;padding:3px 7px;cursor:pointer;color:var(--muted);flex-shrink:0}
  .kb-head .st-btn:hover{color:var(--blue);border-color:var(--blue)}
  .kb-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:grab;touch-action:none}
  .kb-card:active{cursor:grabbing}
  .kb-card.dragging{opacity:.45}
  .kb-card:hover{border-color:var(--blue)}
  .kb-ghost{position:fixed;z-index:99;opacity:.92;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.25)}
  .kb-card .nm{font-weight:700;font-size:13px}
  .kb-card .cu{font-size:10.5px;color:var(--muted);margin-bottom:5px}
  .kb-card .row{display:flex;justify-content:space-between;font-size:11px;padding:1px 0}
  .kb-card .row b{font-variant-numeric:tabular-nums}
  .kb-open{display:block;width:100%;margin-top:8px;padding:6px 9px;border:1px solid #cbd9ec;border-radius:7px;background:#eef4fb;color:var(--blue);font:700 10.5px inherit;cursor:pointer}
  .kb-open:hover{background:var(--blue);color:#fff}
  .kb-empty{color:var(--muted);font-size:11.5px;font-style:italic;padding:6px}
  .kb-bar{display:flex;align-items:center;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
  .bank-card{background:linear-gradient(135deg,#18253a 0%,#263c5d 100%);color:#fff;border:none;box-shadow:0 10px 26px rgba(24,37,58,.16);padding:20px 22px}
  .bank-top{display:grid;grid-template-columns:1.4fr repeat(3,minmax(120px,.65fr));gap:14px;align-items:center;margin-bottom:16px}
  .bank-title{font-size:19px;font-weight:800;letter-spacing:-.3px}.bank-sub{font-size:11.5px;color:#aebbd0;margin-top:3px}
  .bank-kpi{padding-left:14px;border-left:1px solid rgba(255,255,255,.16)}
  .bank-kpi .k{font-size:9px;text-transform:uppercase;letter-spacing:.55px;color:#9fb0c9;font-weight:800}
  .bank-kpi .v{margin-top:3px;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bank-form{display:grid;grid-template-columns:1.15fr 1.2fr 1.2fr 130px 1.1fr 1.4fr auto;gap:8px;align-items:end;padding-top:14px;border-top:1px solid rgba(255,255,255,.15)}
  .bank-form label{color:#aebbd0}.bank-form input,.bank-form select{background:rgba(255,255,255,.95)}
  .bank-avail{font-size:10px;color:#aebbd0;margin-top:4px;min-height:15px}
  .bank-history{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15)}
  .bank-history-title{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#aebbd0;font-weight:800;margin-bottom:5px}
  .bank-op{display:grid;grid-template-columns:78px 132px 1fr auto 145px 86px;gap:9px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.09);font-size:11.5px}
  .bank-op:last-child{border-bottom:none}.bank-op .dt{color:#9fb0c9}.bank-op .arr{font-size:9px;font-weight:900;text-align:center;white-space:nowrap;padding:4px 7px;border-radius:5px;background:rgba(255,255,255,.1)}.bank-op .meta{color:#aebbd0;font-size:10px}.bank-op .amt{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.bank-op .usr{color:#aebbd0;font-size:10px;text-align:right;overflow:hidden;text-overflow:ellipsis}
  .bank-op.cancelled{opacity:.52}.bank-op.cancelled .amt{text-decoration:line-through}.bank-cancel{border:1px solid rgba(255,255,255,.25);background:transparent;color:#dbe5f5;border-radius:6px;padding:5px 7px;font:700 9.5px inherit;cursor:pointer}.bank-cancel:hover{background:#a83e45;border-color:#a83e45;color:#fff}.bank-cancelled{font-size:9px;font-weight:800;color:#c7d1e1;text-align:center;text-transform:uppercase}
  @media(max-width:900px){.bank-top{grid-template-columns:1fr 1fr}.bank-form{grid-template-columns:1fr 1fr}.bank-op{grid-template-columns:70px 120px 1fr auto 82px}.bank-op .usr{display:none}}
  .tg{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;background:#eceef2;color:var(--muted);white-space:nowrap}
  .txg{display:grid;gap:10px}
  @media(max-width:760px){.txg{grid-template-columns:1fr 1fr!important}}
  .tip{position:absolute;z-index:120;max-width:430px;background:#141c2c;color:#e8edf6;border-radius:11px;padding:11px 13px;
    font-size:12px;line-height:1.45;box-shadow:0 14px 38px rgba(10,16,28,.38);display:none;pointer-events:none}
  .tip .tp-h{font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:#93a4c2;margin-bottom:7px}
  .tip .tp-r{display:flex;gap:10px;align-items:baseline;padding:2px 0}
  .tip .tp-d{color:#8fa1bf;font-variant-numeric:tabular-nums;flex:none;width:74px}
  .tip .tp-n{flex:1;min-width:0}
  .tip .tp-a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tip .tp-a.pos{color:#7fd6a8}.tip .tp-a.neg{color:#ffa9a0}
  .tip .tp-tag{font-size:9px;font-weight:800;border-radius:4px;padding:1px 5px;background:rgba(255,255,255,.12);color:#c8d5ea;margin-left:5px}
  .tip .tp-sum{border-top:1px solid rgba(255,255,255,.16);margin-top:8px;padding-top:7px;display:flex;justify-content:space-between;gap:12px;font-weight:800}
  .tip .tp-f{color:#93a4c2;font-size:11px;margin-top:6px}
  .hint-num{cursor:help;border-bottom:1px dotted rgba(90,110,140,.5)}
  /* распределение планового поступления по фондам суммами */
  .pa-panel{background:#eef1f5;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:2px 0 10px}
  .pa-top{display:flex;gap:14px;align-items:flex-end;margin-bottom:10px;flex-wrap:wrap}
  .pa-top label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px}
  .pa-top input{width:170px;text-align:right;font-size:15px;font-weight:700;padding:8px 11px}
  .pa-fund{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .pa-fund .pa-name{flex:1;font-size:12.5px;min-width:0}
  .pa-fund input{width:160px;text-align:right;padding:7px 9px}
  .pa-left{font-size:12px;font-weight:700;color:var(--green);margin:7px 0 2px}
  body.sum-mode .money-input,body.sum-mode .oprow .am{cursor:pointer;box-shadow:inset 0 0 0 1px #b9cbe6}

<script>
/* ============ ДАННЫЕ ============ */
const LS='rl-fondy-v2'; // v2: чистый лист, только Атлетико (старые данные целы под ключом rl-fondy-v1)
const FUND_COLORS=['#2563eb','#0891b2','#d97706','#7c3aed','#dc2626','#4f46e5','#b45309','#0e7490'];
const RESERVE_COLOR='#059669';
function fundColorFor(f,i){return /прибыл|резерв/i.test(f?.name||'')?RESERVE_COLOR:FUND_COLORS[i%FUND_COLORS.length]}
// базовый набор фондов строительного проекта — редактируется в каждом проекте
const DEFAULT_FUNDS=[
  {name:'Материалы и субподряд',pct:50},
  {name:'ФОТ рабочих',pct:20},
  {name:'Услуги',pct:4},
  {name:'Транспортные услуги',pct:3},
  {name:'Налоги',pct:8},
  {name:'Накладные (офис, техника, транспорт)',pct:5},
  {name:'Прибыль (резерв)',pct:10}];
let DB={projects:[],sel:null,audit:[],bank:{name:'Главный фонд компании',ops:[]},team:[],taskStages:null};
let APP_TAB='finance';
let _id=1;
const uid=()=>'x'+(_id++)+'_'+Math.random().toString(36).slice(2,6);
function ensureBank(){
  if(!DB.bank||typeof DB.bank!=='object')DB.bank={name:'Главный фонд компании',ops:[]};
  DB.bank.name=DB.bank.name||'Главный фонд компании';DB.bank.ops=Array.isArray(DB.bank.ops)?DB.bank.ops:[];
  return DB.bank;
}
function migrateProject(p){
  p.tasks=p.tasks||[];p.finIn=p.finIn||[];p.finOut=p.finOut||[];
  p.tasks.forEach(t=>{t.status=t.status||'todo';t.priority=t.priority||'normal';t.assignee=t.assignee||'';t.description=t.description||'';t.subtasks=Array.isArray(t.subtasks)?t.subtasks:[];t.comments=Array.isArray(t.comments)?t.comments:[];t.files=Array.isArray(t.files)?t.files:[]});
  // старая пометка «исполнено» (строка превращалась в операцию) → закрытая строка плана
  ['planIn','planOut','finIn','finOut'].forEach(k=>(p[k]||[]).forEach(r=>{
    if(r.closed){r.done=true;r.doneAt=r.closedAt||todayIso();delete r.closed;delete r.closedAt}
  }));
}
function localSave(){
  // Полный журнал хранится на сервере. Если браузерная квота заполнена,
  // сохраняем облегчённую локальную копию и не прерываем render/sync.
  try{localStorage.setItem(LS,JSON.stringify({...DB,_id}));return true}
  catch(e){
    try{localStorage.setItem(LS,JSON.stringify({...DB,audit:(DB.audit||[]).slice(0,200),_id}));return true}
    catch(e2){console.warn('Локальная копия не сохранена',e2);return false}
  }
}
function save(){localSave();schedulePush()}
function load(){
  try{const raw=localStorage.getItem(LS);if(!raw)return false;
    const d=JSON.parse(raw);DB={projects:d.projects||[],stages:d.stages||null,sel:d.sel||null,audit:d.audit||[],bank:d.bank||null,team:d.team||[],taskStages:d.taskStages||null,impUrl:d.impUrl||'',impAuto:!!d.impAuto,impLast:d.impLast||null,dictUrl:d.dictUrl||'',fundDict:d.fundDict||null,atlSeeded:!!d.atlSeeded};_id=d._id||1000;
    ensureBank();
    DB.projects.forEach(migrateProject);
    return DB.projects.length>0;
  }catch(e){return false}
}
/* ============ СИНХРОНИЗАЦИЯ С СЕРВЕРОМ ============
   Источник правды — сервер (Cloudflare Worker + D1). Клиент держит локальную
   копию для мгновенного старта и офлайна. Оптимистическая блокировка версий:
   при конфликте побеждает сервер (данные с другого устройства), клиент
   перечитывает. Ключ доступа хранится только на устройстве. */
const API_BASE='https://rl-fondy-api.uurraa.workers.dev';
const SYNC_URL=API_BASE+'/api/db?ws=rls';
const GOOGLE_CLIENT_ID='690738857241-oechm85eio8np7hepafta8opn9jev6uj.apps.googleusercontent.com';
const KEY_LS='rl-fondy-key';
const SES_LS='rl-fondy-session'; // собственная сессия программы (не портальная)
let _srvVer=0,_dirty=false,_pushT=null,_noPush=true; // _noPush: не пушим, пока не забрали свежее с сервера
function getSession(){
  try{const s=JSON.parse(localStorage.getItem(SES_LS)||'null');
    if(s&&s.token&&s.exp&&s.exp>Date.now()/1000+15&&s.email)return s;}catch(e){}
  return null;
}
const getKey=()=>{const s=getSession();return s?s.token:(localStorage.getItem(KEY_LS)||'')};
const isSuper=()=>{const s=getSession();return s?s.role==='super':!!localStorage.getItem(KEY_LS)};
function setSyncMsg(m,color){const el=document.getElementById('syncStatus');if(el){el.textContent=m;el.style.color=color||'#7d8aa3'}}
function syncBody(){const {sel,...rest}=DB;return {...rest,_id}}
function _timeoutSignal(ms){const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal}
async function syncPull(initial){
  if(!getKey())return;
  try{
    const r=await fetch(SYNC_URL,{headers:{Authorization:'Bearer '+getKey()},signal:_timeoutSignal(12000)});
    if(r.status===401||r.status===403){localStorage.removeItem(SES_LS);localStorage.removeItem(KEY_LS);showKeyGate(r.status);return}
    if(!r.ok)throw 0;
    const j=await r.json();
    if(j.data==null){ // сервер пуст — заливаем локальное состояние как первую версию
      _srvVer=j.ver||0;_noPush=false;render();schedulePush(true);return}
    if(j.ver===_srvVer&&!initial){_noPush=false;setSyncMsg('✓ синхронизировано','#9fd6b0');return}
    const sel=DB.sel;
    const srv=j.data;
    _id=Math.max(_id||1,(srv._id||0)+1);
    DB={...srv,sel};delete DB._id;
    DB.audit=DB.audit||[];
    ensureBank();
    _srvVer=j.ver;_dirty=false;
    localSave();
    DB.projects.forEach(migrateProject);
    _noPush=true; // рендер серверных данных не должен пушить их обратно (эхо)
    ensureStages();render();
    _noPush=false;
    setSyncMsg('✓ синхронизировано','#9fd6b0');
  }catch(e){setSyncMsg('офлайн · данные локально','#e8c37f');if(initial){render();_noPush=false}}
}
async function syncPush(){
  if(!getKey()){setSyncMsg('');return}
  try{
    setSyncMsg('⟳ сохраняю…');
    const r=await fetch(SYNC_URL,{method:'PUT',
      headers:{Authorization:'Bearer '+getKey(),'Content-Type':'application/json'},
      body:JSON.stringify({baseVer:_srvVer,data:syncBody()}),signal:_timeoutSignal(15000)});
    if(r.status===401||r.status===403){localStorage.removeItem(SES_LS);localStorage.removeItem(KEY_LS);showKeyGate(r.status);return}
    if(r.status===409){toast('Данные обновлены с другого устройства — загружаю свежую версию','err');_dirty=false;await syncPull(true);return}
    if(!r.ok)throw 0;
    const j=await r.json();
    _srvVer=j.ver;_dirty=false;
    setSyncMsg('✓ синхронизировано','#9fd6b0');
  }catch(e){setSyncMsg('офлайн · сохранено локально','#e8c37f')}
}
function schedulePush(force){
  if(!getKey()||_noPush)return;
  _dirty=true;clearTimeout(_pushT);
  _pushT=setTimeout(syncPush,force?50:1200);
}
function showKeyGate(reason){
  const host=document.getElementById('main');
  const onSite=location.protocol.startsWith('http');
  let msg='';
  if(reason&&reason.denied)msg=`Аккаунт <b>${esc(reason.denied)}</b> не добавлен в «Фонды проектов». Попроси владельца открыть доступ (кнопка «👥 Доступы»).`;
  else if(reason)msg='Вход не подошёл или сессия истекла — войди заново.';
  host.innerHTML=`<div class="card" style="max-width:460px;margin:70px auto;text-align:center;padding:28px 26px">
    <div style="font-size:18px;font-weight:700;margin-bottom:6px">Вход в «Фонды проектов»</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5">Данные хранятся на защищённом сервере. Вход — через Google-аккаунт, который добавил владелец.</div>
    ${msg?`<div class="warn" style="display:block;margin-bottom:12px">${msg}</div>`:''}

/* ============ РАСЧЁТЫ ============ */
function fundBalances(p){
  // баланс фонда = доли от приходов − расходы из фонда ± перекладки ± ручные пополнения/снятия
  const b={};p.funds.forEach(f=>b[f.id]={in:0,out:0,mv:0,adj:0});
  p.ops.forEach(o=>{
    if(o.type==='in'&&o.alloc)Object.entries(o.alloc).forEach(([fid,a])=>{if(b[fid])b[fid].in+=a});
    if(o.type==='out'&&b[o.fund])b[o.fund].out+=Math.abs(o.amt);
    if(o.type==='adj'&&b[o.fund])b[o.fund].adj+=o.amt;
    if(o.type==='move'){if(b[o.from])b[o.from].mv-=o.amt;if(b[o.to])b[o.to].mv+=o.amt}
  });
  Object.values(b).forEach(x=>x.bal=x.in-x.out+x.mv+x.adj);
  return b;
}
function requireFundBalance(p,fid,amt,action='списания'){
  const f=p.funds.find(x=>x.id===fid),available=fundBalances(p)[fid]?.bal||0,need=Math.abs(amt||0);
  if(need<=available+0.001)return true;
  toast('Недостаточно денег в фонде «'+(f?.name||'фонд')+'»: доступно '+fmt(Math.max(0,available))+' ₸, нужно '+fmt(need)+' ₸','err');
  return false;
}
function fundDebts(p){
  // непогашенные перекладки: из какого фонда сколько взято и куда (сальдо по паре фондов)
  const net={};
  p.ops.forEach(o=>{if(o.type!=='move')return;
    const [a,b]=[o.from,o.to].sort();const dir=o.from===a?1:-1;
    const k=a+'¦'+b;net[k]=(net[k]||0)+dir*o.amt});
  const out=[];
  Object.entries(net).forEach(([k,v])=>{if(Math.round(v)===0)return;
    const[a,b]=k.split('¦');
    out.push(v>0?{from:a,to:b,amt:v}:{from:b,to:a,amt:-v})});
  return out; // {from: фонд-донор, to: фонд-должник, amt: сколько вернуть}
}
function fundPlan(p,f){
  // план фонда на весь проект: заданная сумма, иначе — доля от договора
  return f.plan>0?f.plan:Math.round((p.contract||0)*(f.pct||0)/100);
}
function allocByPct(p,amt){
  // распределение прихода по долям, без потери копеек
  const total=p.funds.reduce((s,f)=>s+f.pct,0)||100;
  const alloc={};let acc=0;
  p.funds.forEach((f,i)=>{
    let a=i===p.funds.length-1?amt-acc:Math.round(amt*f.pct/total);
    acc+=a;alloc[f.id]=a;
  });
  return alloc;
}
function planAllocation(p,r){
  const amt=Math.abs(r.amt||0);
  const saved=r.alloc||{};
  const sum=Object.values(saved).reduce((s,v)=>s+(Math.abs(Number(v))||0),0);
  return Math.round(sum)===Math.round(amt)&&amt?saved:allocByPct(p,amt);
}
/* ===== ПЛАН ↔ ФАКТ =====
   План независим: строка плана никогда не превращается в операцию и не меняется фактом.
   Фактические операции «заливают» строки плана каскадом по датам: хватило на строку —
   она закрашена полностью, излишек переливается в следующую, не хватило — строка залита
   частично. Расходы заливаются в пределах своего фонда. Пометка «выполнено» — ручная. */
const planKey=(kind,id)=>kind+':'+id;
function planCascade(p,kind){
  const rows=planArr(p,kind).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const isIncome=kind==='in'||kind==='finin';
  const isFin=kind==='finin'||kind==='finout';
  const map={_over:0,_fact:0};
  if(isIncome){
    let pool=p.ops.filter(o=>o.type==='in'&&(isFin?(o.src==='fin'||o.src==='bank'):(o.src!=='fin'&&o.src!=='bank'))).reduce((s,o)=>s+Math.abs(o.amt||0),0);
    map._fact=pool;
    rows.forEach(r=>{const amt=Math.abs(r.amt||0);const fill=Math.min(pool,amt);pool-=fill;
      map[r.id]={amt,fill,pct:amt?Math.min(100,fill/amt*100):0}});
    map._over=pool; // факта пришло больше, чем всего в плане
  }else{
    const byFund={};
    p.ops.filter(o=>o.type==='out'&&(isFin?(o.src==='fin'||o.src==='bank'):(o.src!=='fin'&&o.src!=='bank'))).forEach(o=>{
      byFund[o.fund||'']=(byFund[o.fund||'']||0)+Math.abs(o.amt||0);map._fact+=Math.abs(o.amt||0)});
    rows.forEach(r=>{const amt=Math.abs(r.amt||0);const k=r.fund||'';
      const pool=byFund[k]||0;const fill=Math.min(pool,amt);byFund[k]=pool-fill;
      map[r.id]={amt,fill,pct:amt?Math.min(100,fill/amt*100):0}});
    map._over=Object.values(byFund).reduce((s,v)=>s+v,0);
  }
  return map;
}
function planRemainC(cas,r){
  if(r.done)return 0;
  const c=cas[r.id]||{amt:Math.abs(r.amt||0),fill:0};
  return Math.max(c.amt-c.fill,0);
}
function planStatusC(cas,r){
  const c=cas[r.id]||{amt:Math.abs(r.amt||0),fill:0,pct:0};
  const rem=Math.max(c.amt-c.fill,0);
  if(r.done)return{cls:'ok',text:'выполнено',pct:100,fill:c.fill,amt:c.amt,rem:0};
  if(c.pct>=99.5)return{cls:'ok',text:'залито',pct:100,fill:c.fill,amt:c.amt,rem};
  if(c.fill>0)return{cls:'part',text:Math.round(c.pct)+'% · '+fmtM(c.fill),pct:c.pct,fill:c.fill,amt:c.amt,rem};
  return r.date<todayIso()?{cls:'late',text:'просрочен',pct:0,fill:0,amt:c.amt,rem}
                          :{cls:'wait',text:'ожидается',pct:0,fill:0,amt:c.amt,rem};
}
function planTotals(p,kind){
  const cas=planCascade(p,kind);
  return planArr(p,kind).reduce((a,r)=>{
    const c=cas[r.id]||{amt:Math.abs(r.amt||0),fill:0};
    a.plan+=c.amt;a.fill+=c.fill;a.rem+=planRemainC(cas,r);return a;
  },{plan:0,fill:0,rem:0,over:cas._over,fact:cas._fact});
}

}
function monthKey(iso){return (iso||'').slice(0,7)}
function monthly(p){
  // прошлое — фактом (операции), будущее — планом (строки плана с датой >= сегодня)
  // каждая строка несёт детализацию d — из чего сложилась цифра месяца (для подсказок)
  const t=todayIso();
  const ev=[];
  p.ops.forEach(o=>{
    const nm=(o.note||'').trim();
    if(o.type==='in')ev.push({m:monthKey(o.date),fin:o.amt,d:{k:'fin',date:o.date,amt:o.amt,note:nm||'поступление',cp:o.cp||''}});
    if(o.type==='out')ev.push({m:monthKey(o.date),fout:-Math.abs(o.amt),d:{k:'fout',date:o.date,amt:-Math.abs(o.amt),note:nm||'расход',cp:o.cp||'',fund:o.fund}});
    if(o.type==='adj')ev.push(o.amt>0
      ?{m:monthKey(o.date),fin:o.amt,d:{k:'fin',date:o.date,amt:o.amt,note:nm||'пополнение фонда вручную'}}
      :{m:monthKey(o.date),fout:o.amt,d:{k:'fout',date:o.date,amt:o.amt,note:nm||'снятие из фонда вручную'}});
  });
  // план в прогнозе — только НЕисполненный остаток строки; просроченный остаток переносится в текущий месяц
  const curM=monthKey(t);
  const addPlan=(cas,r,sign,label)=>{
    const rem=planRemainC(cas,r);if(!rem)return;
    const late=monthKey(r.date)<curM;
    const m=late?curM:monthKey(r.date);
    const d={k:sign>0?'pin':'pout',date:r.date,amt:sign>0?rem:-rem,note:(r.note||'').trim()||label,
      plan:Math.abs(r.amt||0),late,fund:r.fund};
    ev.push(sign>0?{m,pin:rem,d}:{m,pout:-rem,d});
  };
  const cIn=planCascade(p,'in'),cOut=planCascade(p,'out'),cFI=planCascade(p,'finin'),cFO=planCascade(p,'finout');
  p.planIn.forEach(r=>addPlan(cIn,r,1,'плановое поступление'));
  p.planOut.forEach(r=>addPlan(cOut,r,-1,'плановый расход'));
  (p.finIn||[]).forEach(r=>addPlan(cFI,r,1,'финансирование'));
  (p.finOut||[]).forEach(r=>addPlan(cFO,r,-1,'возврат финансирования'));
  const keys=[...new Set(ev.map(e=>e.m))].filter(Boolean).sort();
  if(!keys.length)return[];
  // непрерывный диапазон месяцев
  const months=[];let [y,m]=keys[0].split('-').map(Number);const [ey,em]=keys[keys.length-1].split('-').map(Number);
  while(y<ey||(y===ey&&m<=em)){months.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++}}
  let run=0;
  return months.map(k=>{
    const r={m:k,fin:0,fout:0,pin:0,pout:0,det:[]};
    ev.forEach(e=>{if(e.m===k){r.fin+=e.fin||0;r.fout+=e.fout||0;r.pin+=e.pin||0;r.pout+=e.pout||0;if(e.d)r.det.push(e.d)}});
    r.open=run;r.net=r.fin+r.fout+r.pin+r.pout;run+=r.net;r.run=run;
    return r;
  });
}
function firstGap(p){const rows=monthly(p);const g=rows.find(r=>r.run<0);return g?{m:g.m,short:g.run}:null}

function bindKbDrag(){
  document.querySelectorAll('.kb-card').forEach(el=>{
    // Резервный обычный click нужен для мышей/трекпадов, где pointerup иногда
    // теряется после pointer capture. Защита времени не даёт открыть карточку
    // повторно после штатного pointerup или после перетаскивания.
    el.onclick=e=>{if(e.target.closest('.kb-open'))return;if(Date.now()-(el._kbPointerEnd||0)>300)openProject(el.dataset.pid)};
    el.onpointerdown=ev=>{
    if(ev.target.closest('.kb-open'))return;
    if(ev.button!==undefined&&ev.button!==0)return;
    ev.preventDefault();
    const pid=el.dataset.pid;const st={moved:false,sx:ev.clientX,sy:ev.clientY,ghost:null,hot:null};
    el.setPointerCapture(ev.pointerId);
    const move=e=>{
      // Небольшое движение мыши остаётся обычным кликом. Раньше порог был
      // слишком чувствительным, поэтому карточка вместо открытия начинала drag.
      if(!st.moved&&Math.hypot(e.clientX-st.sx,e.clientY-st.sy)<14)return;
      if(!st.moved){st.moved=true;el.classList.add('dragging');
        st.ghost=el.cloneNode(true);st.ghost.classList.add('kb-ghost');
        st.ghost.style.width=el.offsetWidth+'px';document.body.appendChild(st.ghost);}
      st.ghost.style.left=(e.clientX+10)+'px';st.ghost.style.top=(e.clientY+8)+'px';
      const t=document.elementFromPoint(e.clientX,e.clientY);
      const col=t&&t.closest?t.closest('.kb-col'):null;
      if(st.hot&&st.hot!==col)st.hot.classList.remove('drop-hot');
      st.hot=col;if(col)col.classList.add('drop-hot');
    };
    const up=()=>{
      el._kbPointerEnd=Date.now();
      el.onpointermove=null;el.onpointerup=null;el.onpointercancel=null;
      el.classList.remove('dragging');if(st.ghost)st.ghost.remove();
      document.querySelectorAll('.kb-col').forEach(c=>c.classList.remove('drop-hot'));
      if(!st.moved){openProject(pid);return}
      if(!st.hot)return;
      const p=DB.projects.find(x=>x.id===pid);const stg=DB.stages.find(s=>s.id===st.hot.dataset.st);
      if(p&&stg&&p.stage!==stg.id){p.stage=stg.id;auditLog('Изменён этап проекта',stg.name,p);toast('Проект → «'+stg.name+'» ✓')}
      render();
    };
    el.onpointermove=move;el.onpointerup=up;el.onpointercancel=up;
  }});
}

/* ---- файлы ---- */
function fileIcon(name){const e=(name||'').split('.').pop().toLowerCase();
  if(/(jpg|jpeg|png|gif|webp|heic|bmp)/.test(e))return '🖼';if(e==='pdf')return '📕';
  if(/(xls|xlsx|csv)/.test(e))return '📊';if(/(doc|docx)/.test(e))return '📄';if(/(zip|rar|7z)/.test(e))return '🗜';return '📎'}
function fileHuman(n){return n<1024?n+' Б':n<1048576?(n/1024).toFixed(0)+' КБ':(n/1048576).toFixed(1)+' МБ'}
function fileUrl(f){return API_BASE+'/api/file?key='+encodeURIComponent(f.key)+'&t='+encodeURIComponent(getKey())}
function filesHtml(t){
  const items=t.files.length?t.files.map(f=>`<div class="att"><span class="ic">${fileIcon(f.name)}</span>
    <span class="nm"><a href="${fileUrl(f)}" target="_blank" rel="noopener" title="${esc(f.name)}">${esc(f.name)}</a><span>${fileHuman(f.size||0)} · ${esc((f.by||'').split('@')[0])}</span></span>
    <span class="del" onclick="delFile('${f.id}')" title="убрать вложение">×</span></div>`).join(''):'';
  return `<div class="att-box"><label style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted)">Вложения · ${t.files.length}</label>
    <div class="att-list">${items}</div>
    <div class="att-drop" id="attDrop" onclick="document.getElementById('attFile').click()"
      ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')"
      ondrop="event.preventDefault();this.classList.remove('over');uploadFiles(event.dataTransfer.files)">
      📎 Перетащи файлы сюда или нажми, чтобы выбрать<div style="font-size:10.5px;margin-top:3px">фото с объекта, акты, счета, документы — до 25 МБ</div></div>
    <input type="file" id="attFile" multiple style="display:none" onchange="uploadFiles(this.files);this.value=''">
    <div class="att-up" id="attUp"></div></div>`;
}
async function uploadFiles(fileList){
  const x=window._taskEdit,p=DB.projects.find(z=>z.id===x?.pid),t=taskArr(p||{}).find(z=>z.id===x?.tid);if(!p||!t)return;
  const files=[...fileList];if(!files.length)return;
  const up=document.getElementById('attUp');
  for(let i=0;i<files.length;i++){const f=files[i];
    if(f.size>25*1024*1024){toast('«'+f.name+'» больше 25 МБ — пропущено','err');continue}
    if(up)up.textContent='Загружаю '+(i+1)+' из '+files.length+': '+f.name+'…';
    try{
      const r=await fetch(API_BASE+'/api/upload',{method:'POST',headers:{Authorization:'Bearer '+getKey(),'X-File-Name':encodeURIComponent(f.name),'Content-Type':f.type||'application/octet-stream'},body:f});
      if(!r.ok)throw 0;const meta=await r.json();
      t.files=t.files||[];t.files.push({id:uid(),key:meta.key,name:meta.name||f.name,size:meta.size||f.size,type:meta.type,by:meta.by,at:meta.at});
      auditLog('Прикреплён файл',t.title+': '+(meta.name||f.name),p);
    }catch(e){toast('Не загрузился: '+f.name,'err')}
  }
  if(up)up.textContent='';t.updatedAt=new Date().toISOString();toast('Файлы прикреплены ✓');save();render();
}
function delFile(fid){const x=window._taskEdit,p=DB.projects.find(z=>z.id===x?.pid),t=taskArr(p||{}).find(z=>z.id===x?.tid);if(!p||!t)return;
  if(!confirm('Убрать вложение из задачи?'))return;
  t.files=(t.files||[]).filter(f=>f.id!==fid);save();render()}
function saveTaskEditor(){
  const x=window._taskEdit,p=DB.projects.find(z=>z.id===x?.pid),t=taskArr(p||{}).find(z=>z.id===x?.tid);if(!p||!t)return;
  const title=document.getElementById('editTaskTitle').value.trim();if(!title){toast('Название задачи обязательно','err');return}
  const target=DB.projects.find(z=>z.id===document.getElementById('editTaskProject').value)||p,status=document.getElementById('editTaskStatus').value;
  t.title=title;t.status=status;t.done=status==='done';t.assignee=document.getElementById('editTaskAssignee').value;t.due=document.getElementById('editTaskDue').value||null;t.priority=document.getElementById('editTaskPriority').value;t.description=document.getElementById('editTaskDescription').value.trim();t.subtasks=readSubtasks('editSubtasks');t.updatedAt=new Date().toISOString();

function bankStats(){
  const bank=ensureBank();let incoming=0,outgoing=0;
  bank.ops.forEach(o=>{if(o.cancelledAt)return;if(o.dir==='in')incoming+=Math.abs(o.amt||0);else outgoing+=Math.abs(o.amt||0)});
  return{incoming,outgoing,balance:incoming-outgoing};
}

  const sel=document.getElementById('bankFund');sel.innerHTML=p.funds.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('');bankUpdateUI();
}
function bankDirChange(){bankUpdateUI()}
function bankUpdateUI(){
  const dir=document.getElementById('bankDir')?.value||'toBank';
  const p=DB.projects.find(x=>x.id===document.getElementById('bankProject')?.value),fid=document.getElementById('bankFund')?.value;
  const el=document.getElementById('bankAvail'),btn=document.getElementById('bankBtn');if(btn)btn.textContent=dir==='toBank'?'Перевести в Главный фонд':'Финансировать проект';
  if(!el)return;if(dir==='fromBank'){el.textContent='доступно в Главном фонде: '+fmt(bankStats().balance)+' ₸';return}
  const bal=p&&fundBalances(p)[fid]?.bal||0;el.textContent='доступно в фонде: '+fmt(bal)+' ₸';
}
function addBankTransfer(){
  const dir=document.getElementById('bankDir')?.value||'toBank';
  const p=DB.projects.find(x=>x.id===document.getElementById('bankProject')?.value);if(!p){toast('Выберите проект','err');return}
  const fid=document.getElementById('bankFund')?.value,f=p.funds.find(x=>x.id===fid);if(!f){toast('Выберите фонд проекта','err');return}
  const date=document.getElementById('bankDate')?.value,amt=Math.abs(impNum(document.getElementById('bankAmt')?.value));
  if(!date||!amt){toast('Укажите дату и сумму','err');return}
  const source=dir==='toBank'?(fundBalances(p)[fid]?.bal||0):bankStats().balance;
  if(amt>source){toast(dir==='toBank'?'В фонде недостаточно денег':'В Главном фонде компании недостаточно денег','err');return}
  const id=uid(),note=document.getElementById('bankNote')?.value.trim()||'',user=getSession()?.email||'доступ по ключу';
  ensureBank().ops.unshift({id,date,createdAt:new Date().toISOString(),dir:dir==='toBank'?'in':'out',projectId:p.id,project:p.name,fundId:f.id,fund:f.name,amt,user,note});
  if(dir==='toBank')p.ops.push({id:uid(),type:'out',date,amt:-amt,fund:f.id,src:'bank',bankTransferId:id,note:note||'перевод в Главный фонд компании'});
  else p.ops.push({id:uid(),type:'in',date,amt,alloc:{[f.id]:amt},src:'bank',bankTransferId:id,note:note||'финансирование из Главного фонда компании'});
  window._bankKeep={dir,projectId:p.id,date};
  auditLog(dir==='toBank'?'Перевод в Главный фонд компании':'Финансирование из Главного фонда компании',fmt(amt)+' ₸ · '+f.name+(note?' · '+note:''),p);
  toast(dir==='toBank'?'Деньги переведены в Главный фонд компании ✓':'Проект профинансирован из Главного фонда ✓');render();
}
function cancelBankTransfer(id){
  const o=ensureBank().ops.find(x=>x.id===id);if(!o||o.cancelledAt)return;
  const p=DB.projects.find(x=>x.id===o.projectId);if(!p){toast('Проект этой операции не найден','err');return}
  const linked=p.ops.find(x=>x.bankTransferId===id);
  if(!linked){toast('Связанная проводка проекта не найдена','err');return}
  const amt=Math.abs(o.amt||0);
  if(o.dir==='in'&&bankStats().balance<amt){toast('Нельзя отменить: деньги из Главного фонда уже использованы','err');return}
  if(o.dir==='out'&&(fundBalances(p)[o.fundId]?.bal||0)<amt){toast('Нельзя отменить: деньги в фонде уже использованы','err');return}
  if(!confirm('Отменить перевод '+fmt(amt)+' ₸? Запись останется в истории со статусом «Отменено».'))return;
  p.ops=p.ops.filter(x=>x.bankTransferId!==id);
  o.cancelledAt=new Date().toISOString();o.cancelledBy=getSession()?.email||'доступ по ключу';
  auditLog('Отменён перевод Главного фонда компании',fmt(amt)+' ₸ · '+o.fund+' · '+(o.dir==='in'?'из проекта в Главный фонд':'из Главного фонда в проект'),p);
  toast('Перевод отменён, остатки восстановлены ✓');render();
}

/* ============ ИМПОРТ ИЗ GOOGLE ТАБЛИЦЫ ============ */
function impCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else{if(c==='"')q=true;
      else if(c===','){row.push(cur);cur=''}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
      else if(c!=='\r')cur+=c}}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c&&c.trim()));
}
function impTable(text){
  if(text.includes('\t'))return text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split('\t'));
  return impCSV(text);
}
function impNum(s){if(s==null)return 0;s=String(s).replace(/[\s ₸]/g,'');
  if(/,\d{1,2}$/.test(s)&&!s.includes('.'))s=s.replace(/,(\d{1,2})$/,'.$1');
  s=s.replace(/,/g,'');
  const v=parseFloat(s);return isNaN(v)?0:v}
function impDate(s){s=(s||'').trim();
  let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  return null}
function impCols(rows){
  for(let i=0;i<Math.min(rows.length,6);i++){
    const low=rows[i].map(c=>(c||'').toLowerCase());
    const find=(...keys)=>low.findIndex(c=>keys.some(k=>c.includes(k)));
    const date=find('дата'),amt=find('сумма');
    if(date>=0&&amt>=0)return {head:i,date,amt,
      proj:find('направ'),art:find('статья'),cp:find('контрагент','поставщик'),
      note:find('назнач','наименование'),fund:find('фонд')};
  }
  return null}
function impFundByArt(p,art){
  const a=(art||'').toLowerCase();
  const pick=re=>p.funds.find(f=>re.test(f.name.toLowerCase()));
  let f=null;
  if(/фот|зарплат|оклад/.test(a))f=pick(/фот|зарплат/);
  else if(/налог/.test(a))f=pick(/налог/);
  else if(/тмц|материал|смр|субподряд|услуг|транспорт|гсм|аренд|расходник/.test(a))f=pick(/матер|тмц|субподряд/);
  else if(/дивиден|прибыл|финансир|займ|инвест/.test(a))f=pick(/прибыл|резерв/);
  else f=pick(/накладн/);
  return f||p.funds[0]}
/* справочник фондов из Google Таблицы: Фонд | Доля % | Статьи (через запятую) */
function dictParse(rows){
  for(let i=0;i<Math.min(rows.length,6);i++){
    const low=rows[i].map(c=>(c||'').toLowerCase());
    const fi=low.findIndex(c=>c.includes('фонд')||c.includes('назван'));
    if(fi<0)continue;
    const pi=low.findIndex(c=>c.includes('дол')||c.includes('%'));
    const ai=low.findIndex(c=>c.includes('стать'));
    const out=[];
    for(let j=i+1;j<rows.length;j++){const r=rows[j];const name=(r[fi]||'').trim();if(!name)continue;
      out.push({name,pct:pi>=0?impNum(r[pi]):0,arts:ai>=0?(r[ai]||'').split(/[,;]/).map(s=>s.trim()).filter(Boolean):[]})}
    if(out.length)return out;
  }
  return null;
}
function dictFetch(){
  const url=document.getElementById('dictUrl').value.trim();
  if(!url){toast('Вставь ссылку на CSV справочника','err');return}
  DB.dictUrl=url;save();
  fetch(url).then(r=>{if(!r.ok)throw 0;return r.text()}).then(text=>{
    const d=dictParse(impTable(text));
    if(!d){toast('Не нашёл колонки справочника: нужны «Фонд», «Доля %», «Статьи»','err');return}
    DB.fundDict=d;save();
    toast('Справочник фондов загружен: '+d.length+' ✓');render();
  }).catch(()=>toast('Не загрузилось — проверь доступ «всем, у кого есть ссылка»','err'));
}
function dictFund(p,art){
  // фонд по справочнику: статья входит в список статей фонда
  if(!DB.fundDict||!DB.fundDict.length||!art)return null;
  const a=art.toLowerCase().trim();
  const d=DB.fundDict.find(d=>(d.arts||[]).some(x=>{const xl=(x||'').toLowerCase();return a===xl||a.includes(xl)||xl.includes(a)}));
  if(!d)return null;
  return p.funds.find(f=>f.name.toLowerCase().includes(d.name.toLowerCase())||d.name.toLowerCase().includes(f.name.toLowerCase()))||null;
}
const IMP_SKIP=/депозит|перевод меж|комисси/i;
let _impPlan=null;
function impFetch(){
  const url=document.getElementById('impUrl').value.trim();
  if(!url){toast('Вставь ссылку на CSV','err');return}
  DB.impUrl=url;save();
  fetch(url).then(r=>{if(!r.ok)throw 0;return r.text()}).then(text=>{
    document.getElementById('impText').value=text.length>2e6?text.slice(0,2e6):text;
    impParse();
  }).catch(()=>toast('Не загрузилось: проверь доступ «всем, у кого есть ссылка» — или скопируй строки вручную','err'));
}
function impBuild(rows){
  const cols=impCols(rows);
  if(!cols)return {err:true};
  const plan=[],skip={},missing=new Set();
  const addSkip=w=>{skip[w]=(skip[w]||0)+1};
  for(let i=cols.head+1;i<rows.length;i++){
    const r=rows[i];
    const date=impDate(r[cols.date]),amt=impNum(r[cols.amt]);
    if(!date||!amt)continue;
    const art=(cols.art>=0?r[cols.art]:'')?.trim()||'';
    if(IMP_SKIP.test(art)){addSkip('внутренние операции (депозиты, переводы, комиссии)');continue}
    const projName=(cols.proj>=0?r[cols.proj]:'')?.trim()||'';
    if(!projName){addSkip('без проекта (пустое «Направление»)');continue}
    const p=DB.projects.find(x=>x.name.trim().toLowerCase()===projName.toLowerCase());
    if(!p){missing.add(projName);addSkip('нет такого проекта в программе');continue}
    const note=[(cols.note>=0?r[cols.note]:''),(cols.cp>=0?r[cols.cp]:'')].map(s=>(s||'').trim()).filter(Boolean).join(' · ')||art||'импорт';
    if(p.ops.some(o=>(o.type==='in'||o.type==='out')&&o.date===date&&Math.round(Math.abs(o.amt))===Math.round(Math.abs(amt))&&(o.note||'')===note)){addSkip('уже импортировано (дубль)');continue}
    const fin=/финансир|займ|инвест/i.test(art);
    const fn=(cols.fund>=0?r[cols.fund]:'')?.trim()||'';
    const colFund=fn?p.funds.find(f=>f.name.toLowerCase().includes(fn.toLowerCase())||fn.toLowerCase().includes(f.name.toLowerCase())):null;
    if(amt>0){
      // точное распределение: колонка «Фонд» кладёт весь приход в один фонд, иначе — по долям
      const alloc=colFund?{[colFund.id]:amt}:allocByPct(p,amt);
      plan.push({pid:p.id,op:{type:'in',date,amt,note,src:fin?'fin':undefined,alloc}});
    }else{
      // приоритет: колонка «Фонд» → справочник (по статье) → правила по ключевым словам
      const fund=colFund||dictFund(p,art)||impFundByArt(p,art);
      plan.push({pid:p.id,op:{type:'out',date,amt:-Math.abs(amt),fund:fund.id,note,src:fin?'fin':undefined}});
    }
  }
  return {plan,skip,missing};
}
function applyImpPlan(plan){
  let added=0,rejected=0;
  plan.forEach(x=>{const p=DB.projects.find(z=>z.id===x.pid);if(!p)return;
    if(x.op.type==='out'&&!requireFundBalance(p,x.op.fund,Math.abs(x.op.amt))){rejected++;return}
    p.ops.push({id:uid(),...x.op});added++});
  save();return{added,rejected};
}
function impParse(){
  const text=document.getElementById('impText').value;
  const prev=document.getElementById('impPrev');
  if(!text.trim()){toast('Вставь строки или загрузи по ссылке','err');return}
  const res=impBuild(impTable(text));
  if(res.err){prev.innerHTML='<div class="warn" style="display:block">Не нашёл строку заголовков: нужны колонки «Дата» и «Сумма». Скопируй вместе с шапкой таблицы.</div>';return}
  const {plan,skip,missing}=res;
  _impPlan=plan;
  const byProj={};plan.forEach(x=>{const p=DB.projects.find(z=>z.id===x.pid);
    const b=byProj[p.name]=byProj[p.name]||{in:0,out:0,n:0};b.n++;
    if(x.op.type==='in')b.in+=x.op.amt;else b.out+=Math.abs(x.op.amt)});
  prev.innerHTML=`
    <div style="font-weight:700;font-size:13px;margin-bottom:6px">Готово к импорту: ${plan.length} операций</div>
    ${Object.entries(byProj).map(([n,b])=>`<div style="font-size:12.5px;padding:3px 0">• <b>${esc(n)}</b>: ${b.n} оп. · приход <span class="pos">+${fmtM(b.in)}</span> · расход <span class="neg">−${fmtM(b.out)}</span></div>`).join('')||'<div style="font-size:12.5px;color:var(--muted)">нечего импортировать</div>'}
    ${Object.keys(skip).length?`<div style="font-size:12px;color:var(--muted);margin-top:8px">Пропущено: ${Object.entries(skip).map(([w,n])=>n+' — '+w).join('; ')}</div>`:''}
    ${missing.size?`<div class="warn" style="display:block;margin-top:8px">В программе нет проектов: <b>${[...missing].slice(0,10).map(esc).join('</b>, <b>')}</b>${missing.size>10?'…':''}. Заведи их с точно такими названиями (или переименуй) — и разбери ещё раз.</div>`:''}

function impApply(){
  if(!_impPlan||!_impPlan.length)return;
  const applied=applyImpPlan(_impPlan);
  const n=applied.added;_impPlan=null;
  DB.impLast={t:todayIso()+' '+new Date().toTimeString().slice(0,5),n};
  toast('Импортировано '+n+' операций'+(applied.rejected?' · отклонено без денег: '+applied.rejected:'')+' ✓',applied.rejected?'err':undefined);
  document.getElementById('impText').value='';
  render();
}

function impAutoSync(){
  if(DB.impAuto&&DB.dictUrl)fetch(DB.dictUrl).then(r=>r.text()).then(t=>{const d=dictParse(impTable(t));if(d){DB.fundDict=d;save()}}).catch(()=>{});
  if(!DB.impAuto||!DB.impUrl)return;
  fetch(DB.impUrl).then(r=>{if(!r.ok)throw 0;return r.text()}).then(text=>{
    const res=impBuild(impTable(text));
    if(res.err)return;
    DB.impLast={t:todayIso()+' '+new Date().toTimeString().slice(0,5),n:res.plan.length};
    if(res.plan.length){
      const applied=applyImpPlan(res.plan);
      toast('⇩ Из таблицы подтянуто '+applied.added+' операций'+(applied.rejected?' · отклонено: '+applied.rejected:'')+' ✓',applied.rejected?'err':undefined);
    }
    save();
    if(!DB.sel)render(); // обновляем главную; открытую карточку не трогаем, чтобы не сбить ввод
  }).catch(()=>{});
}

  const finGot=p.ops.filter(o=>o.type==='in'&&(o.src==='fin'||o.src==='bank')).reduce((s,o)=>s+o.amt,0);
  const finRet=p.ops.filter(o=>o.type==='out'&&(o.src==='fin'||o.src==='bank')).reduce((s,o)=>s+Math.abs(o.amt),0);
  const spent=p.ops.filter(o=>o.type==='out'&&o.src!=='fin'&&o.src!=='bank').reduce((s,o)=>s+Math.abs(o.amt),0);
  const planOutLeft=p.planOut.filter(r=>r.date>=todayIso()).reduce((s,r)=>s+Math.abs(r.amt),0);
  const marginPlan=p.contract-spent-planOutLeft;

  const t=todayIso();

  [...p.planIn,...(p.finIn||[])].forEach(r=>{
    const alloc=planAllocation(p,r);
    p.funds.forEach(f=>{
      plannedFundIn[f.id]+=(alloc[f.id]||0);
    });
  });
  [...p.planOut,...(p.finOut||[])].forEach(r=>{if(r.fund)plannedFundOut[r.fund]=(plannedFundOut[r.fund]||0)+Math.abs(r.amt||0)});

  const factInTotal=Object.values(factFundIn).reduce((s,v)=>s+v,0);

      <span class="del" onclick="delTask('${tk.id}')">×</span></div>`}).join(''):'<div style="color:var(--muted);font-size:12.5px;margin-bottom:8px">задач нет</div>'}

/* ============ ДЕЙСТВИЯ ============ */
function updFund(id,key,val){const p=P();const f=p.funds.find(x=>x.id===id);if(!f)return;
  if(key==='pct'){const old=f.pct;f.pct=Math.max(0,Math.min(100,parseFloat(val)||0));auditLog('Изменён плановый процент фонда',f.name+': '+old+'% → '+f.pct+'%',p)}
  else if(key==='plan')f.plan=Math.abs(parseFloat(val)||0);
  else{const old=f.name;f.name=val.trim()||f.name;auditLog('Переименован фонд',old+' → '+f.name,p)}render()}
function addFund(){const p=P();const f={id:uid(),name:'Новый фонд',pct:0};f.color=fundColorFor(f,p.funds.length);p.funds.push(f);auditLog('Добавлен фонд','Новый фонд',p);render()}
function delFund(id){const p=P();const b=fundBalances(p)[id];
  if(Math.round(b.bal)!==0){toast('На фонде '+fmt(b.bal)+' ₸ — сначала перекинь деньги в другой фонд','err');return}
  if([...p.planOut,...(p.finOut||[])].some(r=>r.fund===id)){toast('К этому фонду привязаны плановые расходы — сначала перенеси их в другой фонд','err');return}
  const used=p.ops.some(o=>(o.type==='out'&&o.fund===id)||(o.type==='in'&&o.alloc&&o.alloc[id])||(o.type==='move'&&(o.from===id||o.to===id)));
  if(used&&!confirm('По фонду были операции — история сохранится, но фонд исчезнет из списка. Удалить?'))return;
  const name=p.funds.find(f=>f.id===id)?.name||'Фонд';p.funds=p.funds.filter(f=>f.id!==id);auditLog('Удалён фонд',name,p);render()}
function allocMode(){return document.querySelector('input[name="amode"]:checked')?.value||'manual'}
function allocModeUI(){const box=document.getElementById('manualAlloc');if(box)box.style.display=allocMode()==='manual'?'block':'none';previewAlloc()}
function previewAlloc(){const p=P();const amt=impNum(document.getElementById('inAmt').value);
  const el=document.getElementById('allocPrev');if(!el)return;
  if(allocMode()==='pct'){
    if(!amt){el.style.display='none';return}
    const a=allocByPct(p,amt);el.style.display='block';
    el.innerHTML='<b>Разложится по долям:</b><br>'+p.funds.map(f=>`${esc(f.name)} (${f.pct}%) → <b>${fmt(a[f.id])}</b>`).join('<br>');
  }else{
    el.style.display='none';
    const left=document.getElementById('maLeft');if(!left)return;
    const s=[...document.querySelectorAll('.ma-amt')].reduce((x,i)=>x+Math.abs(impNum(i.value)),0);
    if(!amt&&!s){left.textContent='';return}
    const d=amt-s;
    left.innerHTML=Math.round(d)===0&&amt?'<span style="color:var(--green);font-weight:700">распределено полностью ✓</span>'
      :d>0?'осталось распределить: <b>'+fmt(d)+' ₸</b>'
      :'<span style="color:var(--red);font-weight:700">перебор на '+fmt(-d)+' ₸</span>';
  }}
function addIncome(){const p=P();
  const date=document.getElementById('inDate').value,amt=impNum(document.getElementById('inAmt').value);
  if(!date||!amt||amt<=0){toast('Укажи дату и сумму','err');return}
  let alloc;
  if(allocMode()==='pct'){
    const pctSum=p.funds.reduce((s,f)=>s+f.pct,0);
    if(Math.round(pctSum)!==100){toast('Доли фондов дают '+pctSum+'% — разложи вручную или поправь доли','err');return}
    alloc=allocByPct(p,Math.abs(amt));
  }else{
    alloc={};let s=0;
    document.querySelectorAll('.ma-amt').forEach(i=>{const v=Math.abs(impNum(i.value));if(v){alloc[i.dataset.fid]=v;s+=v}});
    if(Math.round(s)!==Math.round(Math.abs(amt))){toast('Разложи всю сумму: распределено '+fmt(s)+' из '+fmt(Math.abs(amt))+' ₸','err');return}
  }
  const src=document.getElementById('inSrc')?.value==='fin'?'fin':undefined;
  const inArt='',inCp=document.getElementById('inCp')?.value.trim()||'';
  p.ops.push({id:uid(),type:'in',date,amt:Math.abs(amt),note:document.getElementById('inNote').value.trim(),alloc,src,art:inArt||undefined,cp:inCp||undefined});
  auditLog(src?'Внесено финансирование':'Внесено поступление',fmt(amt)+' ₸'+(inCp?' · '+inCp:''),p);
  toast(src?'Финансирование разложено по фондам ✓':'Поступление разложено по фондам ✓');render()}
function outArtChange(){
  const p=P();if(!p)return;
  const art=document.getElementById('outArt')?.value.trim();if(!art)return;
  const f=dictFund(p,art)||impFundByArt(p,art);
  if(f)document.getElementById('outFund').value=f.id;
  previewOut();}
function previewOut(){const p=P();const amt=impNum(document.getElementById('outAmt').value);
  const fid=document.getElementById('outFund').value;const el=document.getElementById('outWarn');
  const b=fundBalances(p)[fid];if(!amt||!b){el.style.display='none';return}
  if(amt>b.bal){el.style.display='block';el.textContent='В фонде '+fmt(b.bal)+' ₸ — после списания уйдёт в минус на '+fmt(amt-b.bal)+' ₸. Либо перекинь из другого фонда.'}
  else el.style.display='none'}
function addExpense(){const p=P();
  const date=document.getElementById('outDate').value,amt=impNum(document.getElementById('outAmt').value);
  if(!date||!amt||amt<=0){toast('Укажи дату и сумму','err');return}
  const oSrc=document.getElementById('outFin')?.checked?'fin':undefined;
  const oArt='',oCp=document.getElementById('outCp')?.value.trim()||'';
  const outFund=document.getElementById('outFund').value;
  if(!requireFundBalance(p,outFund,amt))return;
  p.ops.push({id:uid(),type:'out',date,amt:-Math.abs(amt),fund:outFund,note:document.getElementById('outNote').value.trim(),src:oSrc,art:oArt||undefined,cp:oCp||undefined});
  auditLog(oSrc?'Внесён возврат финансирования':'Внесён расход',fmt(amt)+' ₸ · '+(p.funds.find(f=>f.id===document.getElementById('outFund').value)?.name||'фонд'),p);
  toast(oSrc?'Возврат финансирования списан из фонда ✓':'Расход списан из фонда ✓');render()}
function moveFund(){const p=P();
  const from=document.getElementById('mvFrom').value,to=document.getElementById('mvTo').value;
  const amt=impNum(document.getElementById('mvAmt').value);
  if(!amt||amt<=0){toast('Укажи сумму','err');return}
  if(from===to){toast('Выбери разные фонды','err');return}
  if(!requireFundBalance(p,from,amt))return;
  p.ops.push({id:uid(),type:'move',date:todayIso(),from,to,amt:Math.abs(amt),note:document.getElementById('mvNote')?.value.trim()||''});
  auditLog('Перевод между фондами',fmt(amt)+' ₸ · '+(p.funds.find(f=>f.id===from)?.name||'фонд')+' → '+(p.funds.find(f=>f.id===to)?.name||'фонд'),p);
  toast('Перекинуто между фондами ✓');render()}
function returnDebt(from,to,amt){const p=P();
  const fn=id=>p.funds.find(f=>f.id===id)?.name||'—';
  if(!requireFundBalance(p,to,amt))return;
  if(!confirm('Вернуть '+fmt(amt)+' ₸ из «'+fn(to)+'» обратно в «'+fn(from)+'»?'))return;
  p.ops.push({id:uid(),type:'move',date:todayIso(),from:to,to:from,amt,note:'возврат в фонд'});
  auditLog('Возврат между фондами',fmt(amt)+' ₸ · '+fn(to)+' → '+fn(from),p);
  toast('Возвращено в фонд ✓');render()}

/* ---- задачи по деньгам ---- */
function taskArr(p){p.tasks=p.tasks||[];return p.tasks}
function addTask(){const p=P();
  const t=document.getElementById('tkTitle').value.trim();
  if(!t){toast('Напиши, что сделать','err');return}
  taskArr(p).push({id:uid(),title:t,due:document.getElementById('tkDue').value||null,done:false,status:'todo',priority:'normal',assignee:'',description:'',createdAt:new Date().toISOString()});
  auditLog('Добавлена задача',t,p);
  toast('Задача добавлена ✓');render()}
function quickTask(title,due){const p=P();
  if(taskArr(p).some(x=>x.title===title&&!x.done)){toast('Такая задача уже стоит','err');return}
  taskArr(p).push({id:uid(),title,due:due||null,done:false,status:'todo',priority:'high',assignee:'',description:'',createdAt:new Date().toISOString()});
  auditLog('Добавлена задача',title,p);
  toast('Задача добавлена ✓');render()}
function toggleTask(id){const p=P();const t=taskArr(p).find(x=>x.id===id);if(t){t.done=!t.done;t.status=t.done?'done':'todo';auditLog(t.done?'Задача выполнена':'Задача возвращена в работу',t.title,p)}render()}
function delTask(id){const p=P();const t=taskArr(p).find(x=>x.id===id);p.tasks=taskArr(p).filter(x=>x.id!==id);auditLog('Удалена задача',t?.title||'',p);render()}
function delOp(id){const p=P();const o=p.ops.find(x=>x.id===id);if(o?.bankTransferId){toast('Перевод с Главным фондом компании нельзя удалить из журнала проекта — отмените его на главной странице','err');return}
  const b=fundBalances(p);
  if(o?.type==='in'&&Object.entries(o.alloc||{}).some(([fid,a])=>(b[fid]?.bal||0)<Math.abs(a))){toast('Нельзя удалить поступление: часть денег уже потрачена из фонда','err');return}
  if(o?.type==='adj'&&o.amt>0&&(b[o.fund]?.bal||0)<o.amt){toast('Нельзя удалить пополнение: часть денег уже потрачена','err');return}
  if(o?.type==='move'&&(b[o.to]?.bal||0)<Math.abs(o.amt)){toast('Нельзя удалить перевод: деньги уже потрачены в фонде-получателе','err');return}
  if(!confirm('Удалить операцию?'))return;p.ops=p.ops.filter(o=>o.id!==id);auditLog('Удалена операция',o?(fmt(Math.abs(o.amt||0))+' ₸ · '+(o.note||o.type)):'',p);render()}
/* смена фонда и точная перераскладка операций в журнале */
function opSetFund(id,fid){const p=P();const o=p.ops.find(x=>x.id===id);if(o?.bankTransferId){toast('Фонд перевода с Главным фондом компании не меняется — отмените операцию на главной странице','err');render();return}if(o&&p.funds.some(f=>f.id===fid)){if(o.type==='out'&&o.fund!==fid&&!requireFundBalance(p,fid,Math.abs(o.amt))){render();return}o.fund=fid;auditLog('Изменён фонд операции',p.funds.find(f=>f.id===fid)?.name||'',p);toast('Фонд операции изменён ✓');render()}}
function raOpen(id){window._reallocOp=id;render()}
function raLeft(id){const p=P();const o=p.ops.find(x=>x.id===id);if(!o)return;
  const s=[...document.querySelectorAll('.ra-amt')].reduce((x,i)=>x+Math.abs(impNum(i.value)),0);
  const d=o.amt-s;const el=document.getElementById('raLeft');if(!el)return;
  el.style.color=Math.round(d)===0?'var(--green)':d>0?'var(--muted)':'var(--red)';
  el.innerHTML=Math.round(d)===0?'распределено полностью ✓':d>0?'осталось распределить: '+fmt(d)+' ₸':'перебор на '+fmt(-d)+' ₸'}
function raSave(id){const p=P();const o=p.ops.find(x=>x.id===id);if(!o)return;
  const alloc={};let s=0;
  document.querySelectorAll('.ra-amt').forEach(i=>{const v=Math.abs(impNum(i.value));if(v){alloc[i.dataset.fid]=v;s+=v}});
  if(Math.round(s)!==Math.round(o.amt)){toast('Разложи всю сумму: распределено '+fmt(s)+' из '+fmt(o.amt)+' ₸','err');return}
  const b=fundBalances(p),old=o.alloc||{};
  if(p.funds.some(f=>(b[f.id]?.bal||0)-Math.abs(old[f.id]||0)+Math.abs(alloc[f.id]||0)<-0.001)){toast('Нельзя изменить раскладку: часть поступления уже потрачена из фонда','err');return}
  o.alloc=alloc;window._reallocOp=null;auditLog('Изменено распределение поступления',fmt(o.amt)+' ₸',p);toast('Раскладка обновлена ✓');render()}
function planArr(p,kind){
  if(kind==='in')return p.planIn;
  if(kind==='out')return p.planOut;
  if(kind==='finin')return p.finIn=p.finIn||[];
  return p.finOut=p.finOut||[];
}
function addPlan(kind){const p=P();
  if((kind==='out'||kind==='finout')&&!p.funds.length){toast('Сначала создай фонд','err');return}
  const r={id:uid(),date:todayIso(),amt:0,note:''};
  if(kind==='out'||kind==='finout')r.fund=p.funds[0].id;
  planArr(p,kind).push(r);
  if(kind==='in'||kind==='finin')window._reallocPlan=planKey(kind,r.id); // новая строка поступления сразу открывает распределение по фондам
  auditLog('Добавлена строка плана',kind==='out'||kind==='finout'?'Расход привязан к фонду '+p.funds[0].name:'Плановое поступление',p);render();
  setTimeout(()=>document.getElementById('paAmt')?.focus(),0)}
function updPlan(kind,id,key,val){const p=P();const r=planArr(p,kind).find(x=>x.id===id);if(!r)return;
  const old=key==='fund'?(p.funds.find(f=>f.id===r.fund)?.name||'—'):key==='amt'?fmt(Math.abs(r.amt||0)):String(r[key]||'');
  const sign=(kind==='in'||kind==='finin')?1:-1;
  if(key==='amt')r.amt=sign*Math.abs(impNum(val));
  else if(key==='date')r.date=val;
  else if(key==='fund')r.fund=val;
  else r.note=val;
  const now=key==='fund'?(p.funds.find(f=>f.id===r.fund)?.name||'—'):key==='amt'?fmt(Math.abs(r.amt||0)):String(r[key]||'');
  if(old!==now)auditLog('Изменён план '+(kind==='out'||kind==='finout'?'расходов':'поступлений'),key+': '+old+' → '+now,p);
  render()}
function paOpen(kind,id){window._reallocPlan=kind+':'+id;render()}
function paTargetAmt(r){const v=impNum(document.getElementById('paAmt')?.value);return v||Math.abs(r.amt||0)}
function paLeft(kind,id){const p=P();const r=planArr(p,kind).find(x=>x.id===id);if(!r)return;
  const s=[...document.querySelectorAll('.pa-amt')].reduce((x,i)=>x+Math.abs(impNum(i.value)),0);
  const d=paTargetAmt(r)-s,el=document.getElementById('paLeft');if(!el)return;
  el.style.color=Math.round(d)===0?'var(--green)':d>0?'var(--muted)':'var(--red)';
  el.innerHTML=Math.round(d)===0?'распределено полностью ✓':d>0?'осталось распределить: <b>'+fmt(d)+' ₸</b>':'<b>перебор на '+fmt(-d)+' ₸</b>'}
function paAmtChange(kind,id){const p=P();const r=planArr(p,kind).find(x=>x.id===id);if(!r)return;
  // пока фонды не тронуты вручную — подсказываем разбивку по долям от новой суммы
  const touched=[...document.querySelectorAll('.pa-amt')].some(i=>i.value.trim());
  if(!touched||!r.alloc){const a=allocByPct(p,paTargetAmt(r));document.querySelectorAll('.pa-amt').forEach(i=>{const v=a[i.dataset.fid]||0;i.value=v?fmt(v):''})}
  paLeft(kind,id)}
function paEqual(kind,id){const p=P();const r=planArr(p,kind).find(x=>x.id===id);if(!r)return;
  const a=allocByPct(p,paTargetAmt(r));document.querySelectorAll('.pa-amt').forEach(i=>{const v=a[i.dataset.fid]||0;i.value=v?fmt(v):''});paLeft(kind,id)}
function paSave(kind,id){const p=P();const r=planArr(p,kind).find(x=>x.id===id);if(!r)return;
  const amt=paTargetAmt(r);
  if(!amt){toast('Укажи сумму поступления','err');return}
  const alloc={};let s=0;
  document.querySelectorAll('.pa-amt').forEach(i=>{const v=Math.abs(impNum(i.value));if(v){alloc[i.dataset.fid]=v;s+=v}});
  if(Math.round(s)!==Math.round(amt)){toast('Разложи всю сумму: распределено '+fmt(s)+' из '+fmt(amt)+' ₸','err');return}
  r.amt=(kind==='in'||kind==='finin'?1:-1)*amt;r.alloc=alloc;window._reallocPlan=null;
  auditLog('План поступления распределён по фондам',fmt(amt)+' ₸',p);toast('Поступление распределено по фондам ✓');render()}
/* ручное пополнение / снятие из фонда — любая транзакция идёт через фонд */
function addFundAdj(){const p=P();
  const fund=document.getElementById('faFund').value,dir=document.getElementById('faDir').value;
  const amt=impNum(document.getElementById('faAmt').value);
  if(!fund){toast('Выбери фонд','err');return}
  if(!amt||amt<=0){toast('Укажи сумму','err');return}
  if(dir==='out'&&!requireFundBalance(p,fund,amt))return;
  p.ops.push({id:uid(),type:'adj',date:todayIso(),fund,amt:dir==='in'?Math.abs(amt):-Math.abs(amt),note:document.getElementById('faNote').value.trim()});
  auditLog(dir==='in'?'Фонд пополнен вручную':'Из фонда снято вручную',fmt(amt)+' ₸ · '+(p.funds.find(f=>f.id===fund)?.name||'фонд'),p);
  toast(dir==='in'?'Фонд пополнен ✓':'Снято из фонда ✓');render()}
function fundAdjPrefill(fid,dir){
  const f=document.getElementById('faFund'),d=document.getElementById('faDir');
  if(!f||!d)return;f.value=fid;d.value=dir;
  const a=document.getElementById('faAmt');a.scrollIntoView({block:'center',behavior:'smooth'});a.focus()}
function movePlan(kind,id,days){const p=P();const r=planArr(p,kind).find(x=>x.id===id);if(!r||!r.date)return;
  const d=new Date(r.date);d.setDate(d.getDate()+days);r.date=d.toISOString().slice(0,10);
  auditLog('Перенесена строка плана',(days>0?'+':'')+days+' дней · '+fmt(Math.abs(r.amt||0))+' ₸',p);
  toast(days>0?'Сдвинуто на неделю позже ✓':'Сдвинуто на неделю раньше ✓');render()}
function delPlan(kind,id){const p=P();const arr=planArr(p,kind);const i=arr.findIndex(x=>x.id===id);if(i>=0){const r=arr[i];arr.splice(i,1);auditLog('Удалена строка плана',(kind==='out'||kind==='finout'?'Расход ':'Поступление ')+fmt(Math.abs(r.amt||0))+' ₸',p)}render()}
/* ---- факт по строке плана: отдельная операция со ссылкой на строку ---- */
function scaledAlloc(p,r,amt){
  // раскладка факта по фондам пропорционально раскладке плановой строки
  const base=planAllocation(p,r);
  const keys=Object.keys(base).filter(k=>Math.abs(base[k]||0)>0);
  const total=keys.reduce((s,k)=>s+Math.abs(base[k]),0);
  if(!total)return allocByPct(p,amt);
  const out={};let acc=0;
  keys.forEach((k,i)=>{const v=i===keys.length-1?amt-acc:Math.round(amt*Math.abs(base[k])/total);acc+=v;out[k]=v});
  return out;
}
function pfOpen(kind,id){window._pfPlan=window._pfPlan===planKey(kind,id)?null:planKey(kind,id);window._reallocPlan=null;render()}
function pfPanelHtml(p,kind,r,cas){
  const isIncome=kind==='in'||kind==='finin';
  const st=planStatusC(cas,r);
  const fundSel=!isIncome?`<div><label>Из фонда</label><select id="pfFund">${p.funds.map(f=>`<option value="${f.id}"${r.fund===f.id?' selected':''}>${esc(f.name)}</option>`).join('')}</select></div>`:'';
  return `<div class="pf-panel">
    <div class="ttl">Строка плана ${fmt(st.amt)} ₸ на ${dRu(r.date)} · залито фактом ${fmt(st.fill)} ₸ · осталось ${fmt(st.rem)} ₸${r.done?' · помечена выполненной':''}</div>
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:9px">Быстрый ввод фактической операции: она попадёт в журнал и в общий поток факта, который заливает строки плана по порядку дат${isIncome?'':' в пределах фонда'}. Сумма и дата могут отличаться от плана.</div>
    <div class="pf-grid">
      <div><label>Дата факта</label><input type="date" id="pfDate" value="${r.date<=todayIso()?r.date:todayIso()}"></div>
      <div><label>Сумма факта, ₸</label><input type="text" class="money-input" id="pfAmt" inputmode="numeric" value="${st.rem||st.amt}"></div>
      <div><label>Комментарий</label><input id="pfNote" value="${esc(r.note||'')}"></div>
      <button class="btn grn" onclick="pfSave('${kind}','${r.id}')">Провести факт</button>
    </div>
    ${fundSel?`<div style="margin-top:8px;max-width:280px">${fundSel}</div>`:`<div style="font-size:11px;color:var(--muted);margin-top:7px">Деньги разойдутся по фондам в пропорции этой плановой строки.</div>`}
    <div style="margin-top:11px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" style="padding:6px 12px;font-size:12px" onclick="planDone('${kind}','${r.id}')">${r.done?'↺ снять «выполнено»':'✓ пометить выполненной'}</button>
      <button class="btn ghost" style="padding:6px 12px;font-size:12px" onclick="window._pfPlan=null;render()">Закрыть</button>
    </div>
  </div>`;
}
function pfSave(kind,id){
  const p=P();const r=planArr(p,kind).find(x=>x.id===id);if(!r)return;
  const date=document.getElementById('pfDate').value;
  const amt=Math.abs(impNum(document.getElementById('pfAmt').value));
  if(!date||!amt){toast('Укажи дату и сумму факта','err');return}
  const note=(document.getElementById('pfNote').value||'').trim()||(r.note||'по плану');
  const isIncome=kind==='in'||kind==='finin';
  if(isIncome){
    p.ops.push({id:uid(),type:'in',date,amt,note,src:kind==='finin'?'fin':undefined,alloc:scaledAlloc(p,r,amt)});
  }else{
    const fund=document.getElementById('pfFund')?.value||r.fund||p.funds[0]?.id;
    if(!fund){toast('Выбери фонд','err');return}
    if(!requireFundBalance(p,fund,amt))return;
    p.ops.push({id:uid(),type:'out',date,amt:-amt,fund,note,src:kind==='finout'?'fin':undefined});
  }
  auditLog(isIncome?'Внесено поступление':'Внесён расход',fmt(amt)+' ₸ · '+note,p);
  toast('Факт внесён — строки плана перекрашены ✓');
  window._pfPlan=null;save();render();
}
/* пометка «выполнено» — только вручную; снимает остаток строки с прогноза */
function planDone(kind,id){
  const p=P();const r=planArr(p,kind).find(x=>x.id===id);if(!r)return;
  if(!r.done){
    r.done=true;r.doneAt=todayIso();
    auditLog('Строка плана помечена выполненной',fmt(Math.abs(r.amt))+' ₸ · '+(r.note||''),p);
    toast('Отмечено выполненной — остаток снят с прогноза');
  }else{
    delete r.done;delete r.doneAt;
    auditLog('Со строки плана снята пометка «выполнено»',fmt(Math.abs(r.amt))+' ₸',p);
    toast('Строка снова в прогнозе');
  }
  save();render();
}

/* ============ ЭКСПОРТ / ИМПОРТ ============ */
function exportData(){
  const blob=new Blob([JSON.stringify({...DB,_id},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='rl-fondy-данные-'+todayIso()+'.json';a.click();
  toast('Файл с данными скачан ✓')}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);
    if(!Array.isArray(d.projects))throw 0;
    DB={projects:d.projects,stages:d.stages||null,sel:null,audit:d.audit||[],bank:d.bank||null,team:d.team||[],taskStages:d.taskStages||null,impUrl:d.impUrl||'',impAuto:!!d.impAuto,impLast:d.impLast||null,dictUrl:d.dictUrl||'',fundDict:d.fundDict||null,atlSeeded:!!d.atlSeeded};_id=d._id||9000;ensureBank();
    DB.projects.forEach(migrateProject);
    ensureStages();toast('Данные загружены ✓');render();
  }catch(e){toast('Не получилось прочитать файл','err')}};
  rd.readAsText(f);inp.value='';
}



(function(){
  load();
  ensureStages();
  setWho();
  if(!getKey()){showKeyGate(false)}
  else{render();syncPull(true)}
  setTimeout(impAutoSync,1500);
  setInterval(impAutoSync,600000);
  setInterval(()=>{if(getKey()&&!_dirty)syncPull()},60000); // раз в минуту подтягиваем чужие изменения
})();
</script>
