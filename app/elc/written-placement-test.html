<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Письменный тест · ELC</title><style>

</style><main><h1>Письменный тест на уровень английского</h1><p>Заполните то, что знаете. Пропускайте сложные задания и возвращайтесь к ним. Уровень определит преподаватель.</p><div id="status" role="status">Загрузка заданий…</div><form id="test" hidden><div class="card"><label>Имя и фамилия<input name="name" required maxlength="160" autocomplete="name"></label><label>Телефон<input name="phone" required type="tel" maxlength="40" autocomplete="tel"></label><label>Email (необязательно)<input name="email" type="email" maxlength="254" autocomplete="email"></label><small>Черновик сохраняется в этом браузере.</small></div><div class="test-nav"><nav id="sections" aria-label="Разделы теста"></nav><p id="count" aria-live="polite"></p></div><div id="questions"></div><div class="submit-row"><small>Можно отправить с пропусками. После отправки ответы нельзя изменить.</small><button id="send">Отправить преподавателю</button></div></form></main><script type="module" src="./written-student.js?v=compact-20261019"></script></html>
