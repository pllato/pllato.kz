<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Оценка кандидата — Pllato</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="../../pllato_favicon_64.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a1628; --bronze:#b8895a; --bronze-deep:#8b6740; --bronze-tint:rgba(184,137,90,.08);
  --bg:#fafaf6; --surface:#fff; --surface-2:#f3f0e8; --text:#0f1620; --text-2:#4a5163; --text-3:#8a8d96;
  --line:#e8e2d4; --line-2:#ede9de; --green:#16a34a; --red:#c0392b; --amber:#d98324;
  --r-md:10px; --r-lg:16px; --shadow:0 8px 30px -12px rgba(10,22,40,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 80px}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.top .brand{font-weight:800;letter-spacing:.3px}
.top .tag{font-size:11px;font-family:'JetBrains Mono',monospace;background:var(--bronze);color:#1a1205;padding:3px 8px;border-radius:6px}
.top .sp{flex:1}
.top .timer{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;background:rgba(255,255,255,.1);padding:5px 10px;border-radius:8px}
.top .timer.warn{background:var(--amber);color:#1a1205}
.progress{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 18px}
.progress > i{display:block;height:100%;background:var(--bronze);transition:width .3s}
h1{font-size:24px;font-weight:800;margin:6px 0 8px;letter-spacing:-.4px}
h2{font-size:19px;font-weight:700;margin:4px 0 10px}
p{color:var(--text-2);margin:0 0 12px}
.muted{color:var(--text-3);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.note{background:var(--bronze-tint);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--text-2)}
.note.warn{background:#fff7ec;border-color:#f0d9b5}
.btn{appearance:none;border:none;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;border-radius:12px;padding:14px 22px;transition:.12s;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:#132339}
.btn.primary:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.block{display:flex;width:100%;justify-content:center}
.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 26%);padding:16px;z-index:15}
.foot .inner{max-width:720px;margin:0 auto;display:flex;gap:10px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;border:1px solid var(--line);background:#fff;border-radius:var(--r-md);padding:12px 8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--text-2)}
.seg button.on{border-color:var(--navy);background:var(--navy);color:#fff}
/* Likert */
.likert{border:1px solid var(--line);border-radius:var(--r-md);padding:14px 14px 8px;margin-bottom:12px;background:#fff}
.likert .q{font-weight:600;margin-bottom:12px}
.scale5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale5 button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 4px 8px;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:3px}
.scale5 button small{font-size:9px;font-weight:600;color:var(--text-3);line-height:1.1;text-align:center}
.scale5 button.on{border-color:var(--bronze);background:var(--bronze);color:#fff}
.scale5 button.on small{color:rgba(255,255,255,.85)}
/* options (SJT / cognitive / knowledge) */
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:10px;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--bronze-deep)}
.opt.on{border-color:var(--navy);background:var(--bronze-tint)}
.opt .mk{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text-3)}
.opt.on .mk{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.best.on{border-color:var(--green);background:#eafaf0}.opt.best.on .mk{background:var(--green);border-color:var(--green)}
.opt.worst.on{border-color:var(--red);background:#fdeeec}.opt.worst.on .mk{background:var(--red);border-color:var(--red)}
.bw{display:flex;gap:8px;margin-bottom:10px}
.bw button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-family:inherit;font-weight:700;cursor:pointer;font-size:13px}
.bw button.on-best{border-color:var(--green);background:#eafaf0;color:var(--green)}
.bw button.on-worst{border-color:var(--red);background:#fdeeec;color:var(--red)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:340px;margin:0 auto 16px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center}
.cell.q{background:var(--surface-2);border-style:dashed;font-size:30px;color:var(--text-3)}
.optgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.optcell{aspect-ratio:1;border:1.5px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;padding:5px}
.optcell.on{border-color:var(--navy);background:var(--bronze-tint)}
.codebox{font-family:'JetBrains Mono',monospace;font-size:12px;word-break:break-all;background:var(--navy);color:#cfe;padding:14px;border-radius:var(--r-md);max-height:150px;overflow:auto;user-select:all}
.pairs{font-family:'JetBrains Mono',monospace;font-size:15px;text-align:center;margin:14px 0;line-height:2}
.big-center{min-height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
svg.shape{width:100%;height:100%;display:block}
.hidden{display:none}
.question-meta{display:flex;justify-content:space-between;gap:12px;color:var(--text-2);font-size:13px;margin:12px 0}.question-card{padding:clamp(20px,4vw,36px);box-shadow:none}.question-card h1{font-size:clamp(22px,4vw,30px);line-height:1.3;margin-bottom:24px}.answer-list{display:grid;gap:10px;margin:24px 0}.answer{display:flex;align-items:center;gap:16px;text-align:left;min-height:60px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;font:inherit;color:var(--text);cursor:pointer}.answer span{color:var(--bronze-deep);font-size:13px}.answer:hover,.answer.selected{border-color:var(--bronze);background:var(--bronze-tint)}button:focus-visible,[role=button]:focus-visible{outline:3px solid #2563eb;outline-offset:3px}.result-card{margin-top:40px}.foot{padding-bottom:max(16px,env(safe-area-inset-bottom))}.progress{position:sticky;top:58px;z-index:10}.optgrid .optcell{min-height:52px}
</style>
</head>
<body>
<div class="top">
  <span class="brand">Pllato</span><span class="tag">ОЦЕНКА</span>
  <span class="sp"></span>
  <span id="timer" class="timer hidden">00:00</span>
</div>
<div class="wrap">
  <div class="progress hidden" id="progressBar"><i style="width:0"></i></div>
  <div id="app"></div>
</div>
<div class="foot hidden" id="foot"><div class="inner">
  <button class="btn ghost hidden" id="prevBtn">Назад</button>
  <button class="btn primary block" id="nextBtn">Далее</button>
</div></div>

<!-- данные -->
<script src="data/positions.js"></script>
<script src="data/personality.js"></script>
<script src="data/cognitive.js"></script>
<script src="data/abstract.js"></script>
<script src="data/knowledge.js"></script>
<script src="data/sjt.js"></script>
<script src="data/integrity.js"></script>
<script src="data/biodata.js"></script>
<script src="hr-config.js"></script>
<script src="core.js"></script>
<script>
/* ============ Утилиты ============ */
const $ = s => document.querySelector(s);
const app = $('#app'), foot = $('#foot'), nextBtn = $('#nextBtn'), prevBtn = $('#prevBtn');
const timerEl = $('#timer'), progressBar = $('#progressBar');
const qp = new URLSearchParams(location.search);
const STAGE = ['personality','iq'].includes(qp.get('stage')) ? qp.get('stage') : qp.get('tests')==='personality' ? 'personality' : qp.get('tests')==='cognitive' ? 'iq' : 'full';
const STAGE_LABEL = STAGE==='personality' ? 'Этап 1 — анализ личности' : STAGE==='iq' ? 'Этап 2 — IQ / тест способностей' : 'Анкета кандидата';
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmtTime(s){const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function shuffle(a,seed){a=a.slice();let r=seed||1;for(let i=a.length-1;i>0;i--){r=(r*9301+49297)%233280;const j=Math.floor(r/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// Порядок показа вариантов для задания (перемешивается один раз за сессию и кэшируется).
// В ответе всегда сохраняется ИСХОДНЫЙ индекс варианта (data-oi) — скоринг в панели не меняется.
const OPT_ORDER={};
function optOrder(id,n){ if(!OPT_ORDER[id]){const a=[];for(let i=0;i<n;i++)a.push(i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}OPT_ORDER[id]=a;} return OPT_ORDER[id]; }

/* Рендер фигуры-примитива в SVG */
function renderShapes(prims){
  if(!prims||!prims.length) return '';
  const sz={s:14,m:20,l:28};
  let parts=[];
  const spread = prims.length>1;
  prims.forEach((p,i)=>{
    const r=sz[p.size]||20;
    const cx = spread ? (100/(prims.length+1))*(i+1) : 50;
    const cy = 50;
    const fill = p.fill? '#0f1620':'none';
    const stroke='#0f1620', sw=3;
    let el='';
    if(p.shape==='circle') el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
    else if(p.shape==='square') el=`<rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" transform="rotate(${p.rot||0} ${cx} ${cy})"/>`;
    else if(p.shape==='triangle'){const h=r*1.2;el=`<polygon points="${cx},${cy-h} ${cx-r},${cy+r*0.7} ${cx+r},${cy+r*0.7}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" transform="rotate(${p.rot||0} ${cx} ${cy})"/>`}
    else if(p.shape==='arrow'){el=`<g transform="rotate(${p.rot||0} ${cx} ${cy})"><line x1="${cx}" y1="${cy+r}" x2="${cx}" y2="${cy-r}" stroke="${stroke}" stroke-width="${sw}"/><polyline points="${cx-r*0.5},${cy-r*0.4} ${cx},${cy-r} ${cx+r*0.5},${cy-r*0.4}" fill="none" stroke="${stroke}" stroke-width="${sw}"/></g>`}
    parts.push(el);
  });
  return `<svg class="shape" viewBox="0 0 100 100">${parts.join('')}</svg>`;
}

/* ============ Состояние ============ */
const POS = window.HR_POSITIONS;
const WORKER = ((window.HR_CONFIG&&window.HR_CONFIG.workerUrl)||'').replace(/\/$/,'');
// Ориентиры времени по разделам (минуты)
const MODULE_MIN = {personality:12, cognitive:15, attention:4, sjt:13, integrity:8, biodata:8, knowledge:12};
function posMinutes(fam){ const p=POS[fam]; if(!p)return 0; return (p.modules||[]).reduce((s,m)=>s+(MODULE_MIN[m]||5),0); }
function selectedMinutes(fam){ const requested=(qp.get('tests')||'').split(',').map(s=>s.trim()).filter(Boolean); return requested.length ? requested.reduce((s,m)=>s+(MODULE_MIN[m]||5),0) : posMinutes(fam); }
let state = {
  stage:STAGE, fam:null, kp:null, cform:'A', cand:{name:'',phone:'',email:'',},
  modules:[], mi:0, // module index
  ans:{ personality:{}, fc:[], cognitive:[], sjt:[], integrity:{}, biodata:{}, knowledge:[], attention:null, cogTimes:{} },
  telemetry:{blur:0,paste:0}, startTs:0
};
window.addEventListener('blur',()=>{ if(state.startTs) state.telemetry.blur++ });
document.addEventListener('paste',()=>{ if(state.startTs) state.telemetry.paste++ });

/* ============ Черновик (тот же браузер) ============ */
const DRAFT_KEY='hr_candidate_draft_v3_'+STAGE+'_'+(qp.get('pos')||'any');
function saveDraft(){ try{ if(!state.fam)return; localStorage.setItem(DRAFT_KEY, JSON.stringify({stage:state.stage,fam:state.fam,kp:state.kp,cform:state.cform,modules:state.modules,mi:state.mi,ans:state.ans,cand:state.cand,telemetry:state.telemetry,startTs:state.startTs,partial:state.partial,cogRun:state.cogRun,attempt:state.attempt,ts:Date.now()})); }catch(e){} }
function loadDraft(){ try{ return JSON.parse(localStorage.getItem(DRAFT_KEY)||'null'); }catch(e){ return null; } }
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
window.addEventListener('beforeunload',()=>{ if(state.startTs) saveDraft(); });

/* ============ Роутер экранов ============ */
function setFoot(show,{next='Далее',prev=false,nextEnabled=true}={}){
  foot.classList.toggle('hidden',!show);
  nextBtn.textContent=next; nextBtn.disabled=!nextEnabled;
  prevBtn.classList.toggle('hidden',!prev);
}
let lastProgressSent=0;
function setProgress(f){progressBar.classList.remove('hidden');progressBar.firstElementChild.style.width=(f*100)+'%';progressBar.setAttribute('role','progressbar');progressBar.setAttribute('aria-valuenow',Math.round(f*100));progressBar.setAttribute('aria-label','Прогресс теста');progressBar.setAttribute('aria-valuemin','0');progressBar.setAttribute('aria-valuemax','100');
 if(state.attempt&&Date.now()-lastProgressSent>5000){lastProgressSent=Date.now();fetch(WORKER+'/api/hr/attempt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...state.attempt,progress:Math.round(f*100)}),signal:AbortSignal.timeout(8000)}).catch(()=>{})}
}
async function registerAttempt(){if(state.attempt||!WORKER)return;try{const r=await fetch(WORKER+'/api/hr/attempt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:state.cand.name,phone:state.cand.phone,fam:state.fam,stage:state.stage}),signal:AbortSignal.timeout(8000)});const d=await r.json();if(r.ok&&d.ok){state.attempt={id:d.id,token:d.token};saveDraft()}}catch{}}


/* ---- Старт ---- */
function screenIntro(){
  timerEl.classList.add('hidden'); progressBar.classList.add('hidden');
  // Есть незаконченный черновик? Предложим продолжить.
  const draft = loadDraft();
  const hasProgress = draft && draft.fam && (draft.mi>0 || (draft.ans&&draft.ans.personality&&Object.keys(draft.ans.personality).length) || draft.cogRun);
  if(hasProgress){
    const p=POS[draft.fam];
    app.innerHTML=`<h1>Продолжить анкету?</h1>
      <p>У вас есть незаконченная анкета${draft.cand&&draft.cand.name?' ('+esc(draft.cand.name)+')':''} на должность «${esc(p?p.short:draft.fam)}». Можно продолжить с того места, где вы остановились.</p>
      <div class="card"><div class="muted">Черновик хранится в этом браузере. Пройдено разделов: ${draft.mi} из ${draft.modules.length}.</div></div>
      <div style="text-align:center;margin-top:8px"><a href="#" id="restartLink" class="muted">Начать заново →</a></div>`;
    setFoot(true,{next:'Продолжить'});
    nextBtn.onclick=()=>resumeDraft(draft);
    $('#restartLink').onclick=e=>{e.preventDefault(); clearDraft(); screenIntro();};
    return;
  }
  const preset = qp.get('pos');
  app.innerHTML = `
    <p class="muted">Pllato · подбор сотрудников</p><h1>${STAGE_LABEL}</h1>
    <div class="card"><h2>Приглашение на этап интервью</h2><p>Здравствуйте! Компания <b>Pllato</b> проводит подбор сотрудников. Для прохождения этого этапа интервью необходимо пройти ${STAGE==='personality'?'личностный тест':STAGE==='iq'?'тест на логику и способности':'анкету'} и предоставить результаты менеджеру по набору персонала.</p><p>После завершения результаты отправятся автоматически. Дождитесь сообщения «Ответы получены» — отдельно пересылать их не нужно. Если отправка не удастся, вы сможете повторить её или передать менеджеру резервный код.</p><p class="muted">Менеджер рассмотрит результаты и свяжется с вами для уточнения деталей. Сам тест не принимает окончательное решение о найме.</p></div>
    <p>Профессиональный опросник для подбора персонала. Занимает <b id="estTime">около ${selectedMinutes(preset)||selectedMinutes('manager')} минут</b>. Один вопрос на экране. Нажмите ответ, чтобы перейти дальше. Ответы сохраняются на этом устройстве. В разделах IQ отсчёт времени продолжается, даже если закрыть вкладку.</p>
    <div class="card">
      <div class="field"><label>Имя и фамилия</label><input id="fName" placeholder="Например, Ерлан Ахметов"></div>
      <div class="field"><label>Телефон (для связи)</label><input id="fPhone" type="tel" inputmode="tel" placeholder="+7 701 000 00 00"></div>
      <div class="field"><label>Электронная почта (необязательно)</label><input id="fEmail" type="email" inputmode="email" placeholder="you@example.com"></div>
      <div class="field"><label>Должность, на которую претендуете</label><div class="seg" id="posSeg" style="flex-wrap:wrap">`+
        Object.values(POS).map(p=>`<button data-p="${p.id}" class="${preset===p.id?'on':''}">${p.icon} ${p.short}</button>`).join('')+`</div></div>
    </div>
    <div class="note warn">Нажимая «Начать», вы соглашаетесь на обработку ваших данных (имя, контакты, ответы) для оценки соответствия должности. Результат автоматически отправится работодателю.</div>`;
  let pick = preset||null;
  const estEl=$('#estTime'); if(pick) estEl.textContent='около '+selectedMinutes(pick)+' минут';
  app.querySelectorAll('#posSeg button').forEach(b=>b.onclick=()=>{app.querySelectorAll('#posSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');pick=b.dataset.p;estEl.textContent='около '+selectedMinutes(pick)+' минут';updateNext()});
  ['fName','fPhone','fEmail'].forEach(id=>$('#'+id).oninput=updateNext);
  function valid(){ const ph=($('#fPhone').value||'').replace(/\D/g,''); const em=($('#fEmail').value||'').trim(); return $('#fName').value.trim() && ph.length>=10 && ph.length<=15 && (!em || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) && pick; }
  function updateNext(){ nextBtn.disabled=!valid(); }
  setFoot(true,{next:'Начать',nextEnabled:false}); updateNext();
  nextBtn.onclick=()=>{
    if(!valid()) return;
    state.fam=pick; const p=POS[pick];
    state.cand.name=$('#fName').value.trim(); state.cand.phone=$('#fPhone').value.trim(); state.cand.email=$('#fEmail').value.trim();
    state.kp = qp.get('kp') || p.knowledgeProfile || null;
    state.cform = p.cognitiveForm || qp.get('form') || 'A';
    state.modules = p.modules.slice();
    const only = STAGE==='personality' ? ['personality'] : STAGE==='iq' ? ['cognitive'] : (qp.get('tests')||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(only.length) state.modules=only.filter(m=>Object.hasOwn(MODULE_MIN,m));
    state.partial = only.length>0 && state.modules.length < p.modules.length;
    state.startTs=Date.now(); state.mi=0; saveDraft(); registerAttempt(); runModule();
  };
}
function resumeDraft(draft){
  Object.assign(state,{stage:draft.stage||STAGE,fam:draft.fam,kp:draft.kp,cform:draft.cform,modules:draft.modules,mi:draft.mi||0,ans:draft.ans,cand:draft.cand,telemetry:draft.telemetry||{blur:0,paste:0},startTs:draft.startTs||Date.now(),partial:draft.partial,cogRun:draft.cogRun,attempt:draft.attempt});
  runModule();
}

/* ---- Диспетчер модулей ---- */
const MODULE_TITLES = {
  personality:'Опросник о вас', cognitive:'Тест способностей', attention:'Внимательность',
  sjt:'Рабочие ситуации', integrity:'Рабочие установки', biodata:'Опыт и результаты', knowledge:'Профессиональные знания'
};
function runModule(){
  const m = state.modules[state.mi];
  if(!m){ return screenFinish(); }
  setProgress(state.mi/state.modules.length);

/* ============ Когнитивный (секции с таймером) ============ */
let timerHandle=null;
function startTimer(sec,onEnd,deadline){
  stopTimer();const end=deadline||Date.now()+sec*1000;timerEl.classList.remove('hidden');
  function paint(){const left=Math.max(0,Math.ceil((end-Date.now())/1000));timerEl.textContent=fmtTime(left);timerEl.classList.toggle('warn',left<=30);if(left<=0){stopTimer();onEnd()}}
  timerHandle=setInterval(paint,250);paint();
}
function stopTimer(){ if(timerHandle){clearInterval(timerHandle);timerHandle=null} timerEl.classList.add('hidden') }

function cognitiveItemsFor(section){
  const form=state.cform;
  if(section==='A') return window.HR_ABSTRACT.items.filter(x=>x.form===form);
  return window.HR_COGNITIVE.items.filter(x=>x.section===section && x.form===form);
}
function runCognitive(){
  const budgets=state.cform==='C'?{V:180,N:180,A:240}:{V:240,N:300,A:240};
  const secs=[{k:'V',t:'Логика и слова'},{k:'N',t:'Числа'},{k:'A',t:'Фигуры и закономерности'}];
  const completed=new Set(state.ans.cognitive.map(x=>x.id));
  let si=secs.findIndex(sec=>!cognitiveItemsFor(sec.k).every(it=>completed.has(it.id)));
  if(si<0)return nextModule();
  if(state.cogRun?.deadline)runSec();
  else moduleIntro('IQ · логика и способности','Три раздела: слова, числа и фигуры. Один вопрос на экран. После выбора ответа откроется следующий. Время продолжает идти при закрытии вкладки. Это упражнения, а не стандартизированный показатель IQ.',runSec);
  function runSec(){
    if(si>=secs.length){state.cogRun=null;return nextModule()}
    const sec=secs[si],items=cognitiveItemsFor(sec.k);
    if(!items.length){si++;return runSec()}
    let run=state.cogRun;
    if(!run || run.section!==sec.k)run={section:sec.k,qi:0,answers:items.map(()=>null),times:items.map(()=>0),deadline:null};
    state.cogRun=run;let ended=false,itemStart=Date.now();
    function begin(){if(!run.deadline)run.deadline=Date.now()+budgets[sec.k]*1000;saveDraft();paint();startTimer(budgets[sec.k],endSec,run.deadline)}
    function paint(){
      if(ended)return;
      const it=items[run.qi];itemStart=Date.now();
      app.innerHTML=`<div class="question-meta"><span>${sec.t} · раздел ${si+1} из 3</span><b>${run.qi+1} / ${items.length}</b></div><section class="card question-card">${sec.k==='A'?renderAbstract(it,run.answers[run.qi]):renderVN(it,run.answers[run.qi],run.qi,items.length)}</section>`;
      setProgress((si+run.qi/items.length)/3);setFoot(true,{next:'Пропустить'});
      app.querySelectorAll('[data-oi]').forEach(b=>{b.setAttribute('role','button');b.tabIndex=0;b.setAttribute('aria-label',b.textContent.trim()||('Вариант '+(+b.dataset.oi+1)));b.onclick=()=>advance(+b.dataset.oi);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click()}}});
      nextBtn.onclick=()=>advance(null);window.scrollTo(0,0);
    }
    function advance(answer){if(ended)return;if(Date.now()>=run.deadline)return endSec();run.answers[run.qi]=answer;run.times[run.qi]=Math.round((Date.now()-itemStart)/1000);run.qi++;saveDraft();if(run.qi>=items.length)endSec();else paint()}
    function endSec(){
      if(ended)return;ended=true;stopTimer();
      const ids=new Set(items.map(it=>it.id));state.ans.cognitive=state.ans.cognitive.filter(x=>!ids.has(x.id));
      items.forEach((it,i)=>state.ans.cognitive.push({id:it.id,a:run.answers[i],t:run.times[i]}));
      state.ans.cogTimes[sec.k]=Math.min(budgets[sec.k],Math.max(0,Math.round((Date.now()-(run.deadline-budgets[sec.k]*1000))/1000)));
      state.cogRun=null;saveDraft();si++;runSec();
    }
    if(run.deadline){if(run.qi>=items.length||Date.now()>=run.deadline)endSec();else begin();return}
    app.innerHTML=`<section class="card big-center"><p class="muted">Раздел ${si+1} из 3</p><h1>${sec.t}</h1><p>${items.length} заданий · ${budgets[sec.k]/60} минут</p><p>После выбора ответ изменить нельзя. Если не знаете — нажмите «Пропустить».</p></section>`;
    setFoot(true,{next:'Начать раздел'});nextBtn.onclick=begin;
  }
}

/* ============ Внимательность (генерация пар) ============ */
function genPairs(n,seed){
  let r=seed||7; const rnd=(m)=>{r=(r*9301+49297)%233280;return Math.floor(r/233280*m)};
  const kinds=['iin','contract','iban','too'];
  const out=[];
  for(let i=0;i<n;i++){
    const k=kinds[rnd(kinds.length)]; let a='';
    if(k==='iin') a=Array.from({length:12},()=>rnd(10)).join('');
    else if(k==='contract') a='СМР-'+(2020+rnd(6))+'/'+(100+rnd(900))+'-'+'АБВГ'[rnd(4)];
    else if(k==='iban') a='KZ'+(10+rnd(89))+'601A'+Array.from({length:10},()=>rnd(10)).join('');
    else a='ТОО «'+['СтройМонтаж','КазСервис','АлашГрупп','ТемирБетон','ГрандБуд'][rnd(5)]+(rnd(2)?'Сервис':'Строй')+'»';
    let b=a; const same=rnd(2)===0;
    if(!same){ // внести отличие
      const s=a.split(''); const pos=1+rnd(s.length-2);
      if(/\d/.test(s[pos])) s[pos]=String((+s[pos]+1)%10); else s[pos]=s[pos]==='о'?'0':(s[pos]==='и'?'н':'х');
      b=s.join('');
    }
    out.push({a,b,same});
  }
  return out;
}
function runAttention(){
  const pairs=genPairs(24,Date.now()%9999); let qi=0; let correct=0,errors=0;
  moduleIntro(MODULE_TITLES.attention,
    'Быстро сравнивайте две записи. Нажмите «Одинаково», если они полностью совпадают, или «Различаются», если есть хоть одно отличие. У вас 90 секунд.',
    ()=>{ startTimer(90,end); paint(); },null);
  function paint(){
    if(qi>=pairs.length){ return end(); }
    const p=pairs[qi];
    app.innerHTML=`<div class="muted" style="text-align:center">Пара ${qi+1}</div><div class="pairs">${esc(p.a)}<br>${esc(p.b)}</div>
      <div class="seg"><button id="same">Одинаково</button><button id="diff">Различаются</button></div>`;
    foot.classList.add('hidden');
    $('#same').onclick=()=>ans(true); $('#diff').onclick=()=>ans(false);
  }
  function ans(v){ const p=pairs[qi]; if(v===p.same)correct++;else errors++; qi++; paint(); }
  function end(){ stopTimer(); state.ans.attention={correct,errors,total:qi}; nextModule(); }
}

/* ============ Финиш: скоринг, авто-отправка в систему, экран результата ============ */
function screenFinish(){
  stopTimer(); setProgress(1); foot.classList.add('hidden');
  const result={
    v:1, ts:new Date().toISOString().slice(0,16), stage:state.stage, fam:state.fam, kp:state.kp, cform:state.cform,
    cand:state.cand, total:Math.round((Date.now()-state.startTs)/1000),
    telemetry:state.telemetry, ans:state.ans
  };
  const code=HR.encodeResult(result);
  // локальный скоринг + порог «прошёл/не прошёл»
  let qr; try{ qr=HR.quickResult(result,{}); }catch(e){ app.innerHTML='<div class=card><h1>Не удалось обработать ответы</h1><p>Ответы сохранены на устройстве. Обновите страницу и повторите отправку.</p></div>';return; }
  const passed=!!qr.passed;
  const status=state.stage==='iq' ? (passed?'passed':'failed') : 'review';
  saveDraft(); // сохраняем до подтверждения сервером

  app.innerHTML=`<div class="big-center"><h1>Отправляем результат…</h1><p class="muted">Секунду.</p></div>`;
  const payload={ name:state.cand.name, phone:state.cand.phone, email:state.cand.email||'',
    stage:state.stage, fam:state.fam, kp:state.kp, status, fit:qr.fit, code:code,attempt:state.attempt };

  submitToServer(payload).then(ok=>{
    if(ok)clearDraft();renderDone(passed, ok, code,payload);
  });
}
function submitToServer(payload){
  if(!WORKER) return Promise.resolve(false);
  return fetch(WORKER+'/api/hr/submit', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload),signal:AbortSignal.timeout(15000) })
    .then(async r=>r.ok && (await r.json()).ok===true).catch(()=>false);
}
function renderDone(passed,sent,code,payload){
  const personality=state.stage!=='iq';
  const title=!sent?'Результат ещё не отправлен':personality?'Личностный тест завершён':passed?'Порог упражнений пройден':'Порог упражнений пока не пройден';
  const text=!sent?'Ответы сохранены на этом устройстве. Проверьте интернет и повторите отправку.':personality?'Спасибо за ответы. Результаты переданы менеджеру по набору персонала для рассмотрения. Менеджер свяжется с вами для уточнения деталей.':passed?'По итогам теста менеджер по набору персонала свяжется с вами для уточнения деталей.':'Результат ниже порога этого набора упражнений. Ответы переданы менеджеру для рассмотрения. Это не автоматический отказ в найме.';
  app.innerHTML=`<section class="card result-card"><p class="muted">${sent?'Ответы получены':'Нужна отправка'}</p><h1>${title}</h1><p>${text}</p><p class="muted">${esc(state.cand.name)} · ${esc(state.cand.phone)}</p>${!sent?'<button class="btn primary" id="retrySubmit">Повторить отправку</button>':''}</section>`;
  if(!sent){
    $('#retrySubmit').onclick=async()=>{const b=$('#retrySubmit');b.disabled=true;b.textContent='Отправляем…';const ok=await submitToServer(payload);if(ok)clearDraft();renderDone(passed,ok,code,payload)};
    const box=document.createElement('details');box.className='card';box.innerHTML=`<summary>Резервный код для менеджера</summary><p class="muted">Код содержит ваши ответы и контакты. Передавайте только менеджеру по найму.</p><div class="codebox">${code}</div>`;app.append(box);
  }
}

/* ============ Старт ============ */
screenIntro();
</script>
