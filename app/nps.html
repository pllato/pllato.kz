<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/app/gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c1512">
<meta name="robots" content="noindex,nofollow"/>
<title>ДентаЛайн — NPS (демо)</title>
<style>
:root{
  --bg:#0c1512; --bg2:#101d18; --panel:#13211b; --panel2:#172a22;
  --line:#1e3329; --line2:#2a4636;
  --txt:#e9f3ee; --muted:#90a89c; --muted2:#65806f;
  --accent:#10b981; --accent2:#34d399; --accent-soft:#10b98122;
  --green:#16a34a; --green-soft:#16a34a22;
  --amber:#d97706; --amber-soft:#d9770622;
  --red:#dc2626; --red-soft:#dc262622;
  --blue:#2563eb; --blue-soft:#2563eb22;
  --cyan:#0891b2; --violet:#7c3aed; --pink:#db2777;
  --wa:#25d366;
  --radius:14px; --radius-sm:10px;
  --shadow:0 10px 30px -12px rgba(0,0,0,.55);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:radial-gradient(1200px 700px at 82% -10%,#163328 0%,transparent 55%),
             radial-gradient(900px 600px at -10% 110%,#10231a 0%,transparent 50%),var(--bg);
  color:var(--txt);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#274536;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.svg-i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.svg-i.sm{width:15px;height:15px}.svg-i.lg{width:22px;height:22px}
.hide{display:none!important}

/* ===== APP SHELL ===== */
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,#0f1c16,#0c1512);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-top{padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px}
.brand-logo{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
.brand-logo svg{width:82%;height:82%;display:block;filter:drop-shadow(0 4px 10px rgba(16,185,129,.35))}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.3px}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.company-pill{margin-top:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;align-items:center;gap:9px}
.company-pill .cn{font-weight:600;font-size:13px}
.company-pill .cc{font-size:11px;color:var(--muted);margin-top:1px}
.company-pill .cd{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.nav{padding:8px 10px;flex:1;overflow-y:auto}
.nav-group{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted2);padding:13px 12px 5px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);
  font-size:13.5px;font-weight:500;transition:.13s;width:100%;text-align:left;position:relative}
.nav-item:hover{background:var(--panel);color:var(--txt)}
.nav-item.active{background:linear-gradient(90deg,var(--accent-soft),transparent);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--accent2)}
.nav-item.dim{opacity:.5}
.nav-item .badge{margin-left:auto;background:var(--accent);color:#06231a;font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px}
.nav-item .badge.new{background:var(--amber);color:#2a1503}
.side-bottom{padding:12px;border-top:1px solid var(--line)}
.user-chip{display:flex;align-items:center;gap:10px;padding:9px;border-radius:11px;background:var(--panel);border:1px solid var(--line)}
.user-chip .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.user-chip .ui{flex:1;min-width:0;display:flex;flex-direction:column}
.user-chip .un{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .ut{font-size:11px;color:var(--muted)}

/* ===== MAIN ===== */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{min-height:62px;display:flex;align-items:center;gap:14px;padding:10px 22px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#0c1512cc;backdrop-filter:blur(10px);z-index:20;flex-wrap:wrap}
.page-title{font-size:18px;font-weight:700;letter-spacing:-.3px}
.page-sub{font-size:12px;color:var(--muted);margin-top:1px}
.topbar .search{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;width:220px;color:var(--muted)}
.topbar .search input{background:none;border:none;outline:none;color:var(--txt);width:100%;font-size:13px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:6px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:#06231a}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);
  background:var(--panel);border:1px solid var(--line);position:relative}
.icon-btn:hover{color:var(--txt);border-color:var(--line2)}
.content{padding:22px 24px 70px;overflow-y:auto}
.menu-toggle{display:none}

/* ===== PRIMITIVES ===== */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;
  background:var(--panel);border:1px solid var(--line);color:var(--txt);transition:.14s}
.btn:hover{border-color:var(--line2);background:var(--panel2)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#06231a;box-shadow:0 8px 20px -8px #10b981aa}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 10px;font-size:12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;
  background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.green{background:var(--green-soft);color:#4ade80;border-color:#16653433}
.tag.amber{background:var(--amber-soft);color:#fbbf24;border-color:#92400e33}
.tag.red{background:var(--red-soft);color:#f87171;border-color:#7f1d1d33}
.tag.blue{background:var(--blue-soft);color:#93c5fd;border-color:#1e40af33}
.tag.wa{background:#25d36622;color:#5ee89a;border-color:#15803d44}
.tag.violet{background:#7c3aed22;color:#c4b5fd;border-color:#5b21b633}
.muted{color:var(--muted)}.muted2{color:var(--muted2)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.section-gap{margin-top:20px}
h2.sec{font-size:15px;font-weight:700;margin:2px 0 12px}

.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;position:relative;overflow:hidden;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.kpi:hover{border-color:var(--line2);transform:translateY(-2px)}
.kpi .k-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px}
.kpi .k-lbl{font-size:12px;color:var(--muted);font-weight:500}
.kpi .k-val{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:3px}
.kpi .k-sub{font-size:11.5px;margin-top:7px;display:flex;align-items:center;gap:5px}
.up{color:#4ade80}.down{color:#f87171}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:14.5px;font-weight:700}
.panel-h .ph-sub{font-size:12px;color:var(--muted)}
.panel-b{padding:16px 18px}
.grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}
.grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:24px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted2);
  font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.avatar-xs{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.cell-name{display:flex;align-items:center;gap:9px}
.mini-bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;min-width:64px;flex:1}
.mini-bar>i{display:block;height:100%;border-radius:6px}

.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.fld-in{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--muted)}
.fld-in input{background:none;border:none;outline:none;color:var(--txt);font-size:13px}
select.sel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--txt);font-size:13px;outline:none}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* ===== NPS-SPECIFIC ===== */
.nps-gauge{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.gauge-val{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1}
.ppd-bar{display:flex;height:34px;border-radius:9px;overflow:hidden;width:100%;font-size:11.5px;font-weight:700}
.ppd-bar>div{display:flex;align-items:center;justify-content:center;color:#06231a;min-width:0}
.ppd-legend{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;font-size:12.5px}
.ppd-legend .lg{display:flex;align-items:center;gap:7px}
.ppd-legend .sw{width:11px;height:11px;border-radius:3px}

.trend{width:100%;height:200px;display:block}
.trend .grid-line{stroke:var(--line);stroke-width:1}
.trend .area{fill:url(#npsgrad)}
.trend .ln{fill:none;stroke:var(--accent2);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.trend .dot{fill:var(--accent2);stroke:var(--bg);stroke-width:2}
.trend text{fill:var(--muted2);font-size:10.5px}
.trend .val{fill:var(--txt);font-size:11px;font-weight:700}

.feed{display:flex;flex-direction:column}
.fitem{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.fitem:last-child{border-bottom:none}
.score-chip{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;color:#06231a}
.fitem .fq{font-size:13.5px;line-height:1.5;margin-top:5px}
.fmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.tp-card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;gap:15px;transition:.15s}
.tp-card:hover{border-color:var(--line2)}
.tp-card.off{opacity:.62}
.tp-ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent2)}
.tp-body{flex:1;min-width:0}
.tp-title{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tp-desc{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.tp-tmpl{margin-top:11px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--txt);line-height:1.5}
.tp-foot{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px;align-items:center}
.tp-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}
/* toggle */
.sw-tog{width:44px;height:25px;border-radius:20px;background:var(--line2);position:relative;transition:.18s;flex:none}
.sw-tog.on{background:var(--accent)}
.sw-tog::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.18s}
.sw-tog.on::after{left:22px}

/* client mockup */
.mock-wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.phone{max-width:360px;margin:0 auto;background:#0b141a;border:10px solid #05080a;border-radius:36px;box-shadow:var(--shadow-lg);overflow:hidden}
.wa-top{background:#1f2c33;padding:14px 16px;display:flex;align-items:center;gap:11px}
.wa-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#10b981,#0e7490);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.wa-name{font-size:14px;font-weight:600;color:#e9edef}
.wa-status{font-size:11px;color:#8696a0;margin-top:1px}
.wa-body{background:#0b141a;background-image:radial-gradient(#12232c 1px,transparent 1px);background-size:22px 22px;padding:18px 14px;min-height:360px;display:flex;flex-direction:column;gap:10px}
.wa-msg{max-width:82%;background:#005c4b;color:#e9edef;padding:9px 12px;border-radius:9px;border-top-right-radius:2px;align-self:flex-end;font-size:13.5px;line-height:1.5;box-shadow:0 1px 1px rgba(0,0,0,.3);position:relative}
.wa-msg.in{background:#202c33;align-self:flex-start;border-top-right-radius:9px;border-top-left-radius:2px}
.wa-time{font-size:10px;color:#ffffff88;text-align:right;margin-top:3px}
.wa-scale{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wa-num{width:30px;height:30px;border-radius:8px;background:#111b21;border:1px solid #2a3942;color:#e9edef;font-weight:700;font-size:13px;display:grid;place-items:center;transition:.12s}
.wa-num:hover{border-color:var(--accent2)}
.wa-num.pick{background:var(--accent);color:#06231a;border-color:var(--accent)}
.wa-input{background:#1f2c33;padding:9px 12px;display:flex;gap:9px;align-items:center}
.wa-input input{flex:1;background:#2a3942;border:none;border-radius:18px;padding:9px 13px;color:#e9edef;font-size:13px;outline:none}
.wa-send{width:38px;height:38px;border-radius:50%;background:var(--wa);display:grid;place-items:center;flex:none}
.step-note{font-size:12.5px;color:var(--muted);line-height:1.6}
.legend-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 11px}

/* ===== ПОЯСНЕНИЯ (обучающий слой) ===== */
.hint-toggle.on{background:var(--accent-soft);border-color:#10b98155;color:var(--accent2)}
.ann{background:repeating-linear-gradient(135deg,#101d1855,#101d1855 10px,#0f1c1655 10px,#0f1c1655 20px);
  border:1px dashed var(--line2);border-radius:12px;padding:12px 15px;margin:10px 0 2px;font-size:12.5px;line-height:1.65;color:var(--muted)}
.ann.big{margin:14px 0}
.ann b{color:var(--txt);font-weight:700}
.ann .ann-h{display:flex;align-items:center;gap:7px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;color:var(--accent2);margin-bottom:6px}
.ann .ann-h svg{width:13px;height:13px}
.ann code{background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11.5px;color:var(--accent2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.ann ul{margin:6px 0 0 2px;padding-left:16px}
.ann li{margin:3px 0}
.ann .form{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin-top:6px;color:var(--txt);font-weight:600}
body.no-hints .ann{display:none}
/* методичка-страница */
.guide h3{font-size:15px;margin:20px 0 8px;font-weight:700}
.guide h3:first-child{margin-top:0}
.guide p{font-size:13.5px;line-height:1.7;color:var(--muted);margin:8px 0}
.guide .ppd-legend{margin:10px 0}
.guide table{margin:10px 0}

.demo-banner{background:linear-gradient(90deg,var(--accent-soft),transparent);border:1px solid var(--line);border-left:3px solid var(--accent2);
  border-radius:12px;padding:11px 16px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:10px;margin-bottom:18px}
.demo-banner b{color:var(--txt)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line2);
  border-radius:12px;padding:12px 18px;font-size:13px;box-shadow:var(--shadow-lg);opacity:0;transition:.22s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:980px){.grid-2,.grid-2b,.mock-wrap{grid-template-columns:1fr}}
@media (max-width:760px){.shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-270px;z-index:50;transition:.2s;box-shadow:var(--shadow-lg)}
  .sidebar.open{left:0}.content{padding:14px}.topbar{padding:10px 14px}.topbar .search{display:none}
  .menu-toggle{display:grid}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="brand">
        <div class="brand-logo"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#10b981"><path d="M7.5 3.2C5.4 3.2 4 4.7 4 7c0 2 .6 3.8 1.4 6.6.5 2 .7 4.2 1.8 4.2 1 0 1.3-1.7 1.7-3.6.3-1.3.5-2.2 1.1-2.2s.8.9 1.1 2.2c.4 1.9.7 3.6 1.7 3.6 1.1 0 1.3-2.2 1.8-4.2C19.4 10.8 20 9 20 7c0-2.3-1.4-3.8-3.5-3.8-1.7 0-2.6.9-4.5.9s-2.8-.9-4.5-.9Z"/></svg></div>
        <div>
          <div class="brand-name">ДентаЛайн</div>
          <div class="brand-sub">CRM · демо</div>
        </div>
      </div>
      <div class="company-pill">
        <div>
          <div class="cn">Зубная аптека</div>
          <div class="cc">Revyline · Кыргызстан</div>
        </div>
        <span class="cd"></span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-bottom">
      <div class="user-chip">
        <div class="av" style="background:linear-gradient(135deg,#10b981,#0e7490)">О</div>
        <div class="ui">
          <div class="un">Оксана</div>
          <div class="ut">Владелец</div>
        </div>
      </div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="icon-btn menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><svg class="svg-i"><use href="#i-menu"/></svg></button>
      <div>
        <div class="page-title" id="pageTitle">NPS</div>
        <div class="page-sub" id="pageSub"></div>
      </div>
      <div class="search">
        <svg class="svg-i sm"><use href="#i-search"/></svg>
        <input placeholder="Поиск по ответам…">
      </div>
      <div class="seg" title="Период">
        <button data-d="30">30 дней</button>
        <button class="on" data-d="90">90 дней</button>
        <button data-d="365">Год</button>
      </div>
      <button class="btn sm hint-toggle on" id="hintBtn" title="Показать / скрыть пояснения"><svg class="svg-i sm"><use href="#i-info"/></svg><span>Пояснения</span></button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

      const b=el(`<button class="nav-item${active}${dim}">${ic(it.i)}<span>${it.t}</span>${badge}</button>`);

      nav.appendChild(b);
    });
  });
}

function trendSvg(data){
  const W=560,H=200,pad=34,padB=26;
  const xs=(i)=>pad+i*(W-pad*1.5)/(data.length-1);
  const ys=(v)=>H-padB-((v)/80)*(H-padB-14);
  const pts=data.map((d,i)=>[xs(i),ys(d.n)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-padB} L${pts[0][0].toFixed(1)} ${H-padB} Z`;
  const glines=[0,20,40,60,80].map(v=>`<line class="grid-line" x1="${pad}" x2="${W-8}" y1="${ys(v)}" y2="${ys(v)}"/><text x="4" y="${ys(v)+3}">${v}</text>`).join('');
  const dots=pts.map((p,i)=>`<circle class="dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"/><text class="val" x="${p[0].toFixed(1)}" y="${(p[1]-9).toFixed(1)}" text-anchor="middle">${data[i].n}</text>`).join('');
  const labels=data.map((d,i)=>`<text x="${xs(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${d.ym}</text>`).join('');
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="npsgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34d399" stop-opacity="0.28"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></linearGradient></defs>
    ${glines}<path class="area" d="${area}"/><path class="ln" d="${line}"/>${dots}${labels}</svg>`;
}

function renderDim(body){
  const rows=DB[state.dim];
  const max=Math.max(...rows.map(r=>Math.abs(r.nps)),60);
  body.innerHTML='';
  const tbl=el(`<table class="tbl"><thead><tr><th>Название</th><th style="width:230px">NPS</th><th class="num">Ответов</th></tr></thead><tbody></tbody></table>`);
  const tb=$('tbody',tbl);
  rows.forEach(r=>{
    const col=npsColor(r.nps);
    const w=Math.abs(r.nps)/max*100;
    tb.appendChild(el(`<tr>
      <td><div class="cell-name"><span class="avatar-xs" style="background:${avColor(r.name)}">${initials(r.name)}</span>${esc(r.name)}</div></td>
      <td><div class="row"><b style="color:${col};min-width:38px;font-variant-numeric:tabular-nums">${r.nps>0?'+':''}${r.nps}</b><span class="mini-bar"><i style="width:${w}%;background:${col}"></i></span></div></td>
      <td class="num">${r.responses}</td>
    </tr>`));
  });
  body.appendChild(tbl);
}

function renderFeed(host){
  host.innerHTML='';
  let items=DB.responses;
  if(state.scoreFilter==='promoters')items=items.filter(r=>r.score>=9);
  if(state.scoreFilter==='detractors')items=items.filter(r=>r.score<=6);
  if(!items.length){host.appendChild(el(`<div class="empty">Нет ответов в этом фильтре</div>`));return;}
  items.forEach(r=>{
    const col=scoreColor(r.score);
    host.appendChild(el(`<div class="fitem">
      <div class="score-chip" style="background:${col}">${r.score}</div>

      </div>
    </div>
    <div class="tp-side">
      <div class="sw-tog ${t.on?'on':''}" role="switch" title="Вкл / выкл"></div>
      <span class="tag ${t.on?'green':'red'}" data-st>${t.on?'Активна':'Выключена'}</span>
    </div>
  </div>`);
  const tog=$('.sw-tog',card),st=$('[data-st]',card);
  tog.onclick=()=>{

    st.className='tag '+(t.on?'green':'red');

      <li>Данные о покупках, чеках, продавцах, аптеках, картах — <b>из 1С</b></li>
      <li>Планировщик задач (cron) для запуска рассылок</li>
    </ul></div></div>`));
  rd.appendChild(el(`<div class="panel"><div class="panel-h"><h3 style="color:#fbbf24">Нужно разработать</h3></div><div class="panel-b guide">
    <ul style="color:var(--muted);font-size:13.5px;line-height:1.8;padding-left:18px;margin:0">
      <li>Хранилище опросов и ответов (2 таблицы)</li>
      <li>Диспетчер «событие → отправить опрос» с учётом cooldown</li>
      <li>Раздел NPS в интерфейсе (то, что в этой демке)</li>
    </ul></div></div>`));
  c.appendChild(rd);

  // FAQ
  const faq=el(`<div class="panel section-gap"><div class="panel-h"><h3>Частые вопросы клиента</h3></div><div class="panel-b guide"></div></div>`);
  const qb=$('.panel-b',faq);
  [
    ['Не будем ли спамить покупателей?','Нет. У каждой точки есть cooldown, один клиент не получает опрос чаще заданной паузы. Любую точку можно выключить одним тумблером.'],
    ['Что делать с плохими оценками?','Детракторы (0–6) видны отдельным фильтром и превращаются в задачу — можно перезвонить и вернуть клиента, пока он не ушёл.'],
    ['Откуда система знает аптеку и продавца?','Из чека в 1С: там уже есть аптека, продавец и организация. Опрос привязывается автоматически.'],
    ['Можно ли мерить сотрудников?','Да — разрез «по продавцам» и eNPS. Балл продавца заводится в раздел KPI.'],
    ['Это точные цифры?','В демо — нет, они выдуманы для показа. В рабочей версии всё считается из настоящих ответов.']
  ].forEach(([q,a])=>qb.appendChild(el(`<div style="padding:11px 0;border-bottom:1px solid var(--line)">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:4px">${esc(q)}</div><p style="margin:0">${esc(a)}</p></div>`)));
  c.appendChild(faq);
};

/* ===== init ===== */
console.log('%c[ДЕМО] NPS · данные фейковые, сеть не используется','color:#34d399');
$('#hintBtn').onclick=()=>{
  state.hints=!state.hints;
  document.body.classList.toggle('no-hints',!state.hints);
  $('#hintBtn').classList.toggle('on',state.hints);
  toast(state.hints?'Пояснения включены':'Пояснения скрыты');
};
renderNav();renderPage();
</script>
