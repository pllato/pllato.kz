name = "pllato-meet"
main = "worker.js"
compatibility_date = "2025-01-01"
account_id = "d0655e161d8fca8487f88d55c0eeb215"

# Durable Object — одна «комната» = один объект. Хранит список участников,
# зал ожидания и пересылает WebRTC-сигналы. Видео/звук идут P2P, мимо воркера.
[[durable_objects.bindings]]
name = "MEET_ROOM"
class_name = "MeetRoom"

# SQLite-backed Durable Objects доступны на бесплатном плане Workers.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MeetRoom"]

# Архив встреч: записи (.webm) и транскрипты (.json) в R2.
# Создай бакет один раз:  wrangler r2 bucket create pllato-meet-archive
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "pllato-meet-archive"

# Share the existing CRM archive and index; access remains checked by CRM API.
[[d1_databases]]
binding = "CRM_DB"
database_name = "pllato-elc-d1"
database_id = "3e6c3138-5c6d-4239-ae09-2d60ca2ed0ab"

[[r2_buckets]]
binding = "CRM_FILES"
bucket_name = "pllato-elc-files"

[ai]
binding = "AI"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1
